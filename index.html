function getFormDeploy(){
  const k=parseFloat(document.getElementById('fp-k')?.value||0);
  const dm=window._getDeployMode?window._getDeployMode():'rupiah';
  if(dm==='persen'){
    const pct=parseFloat(document.getElementById('fp-jpct')?.value||0);
    return k*pct/100;
  }
  return parseFloat(document.getElementById('fp-j')?.value||0);
}
// When return% is set, deploy auto-fills to (100 − return%) of contract.
// Only applies when return is in % mode; switches deploy to % mode automatically.
function autoFillDeploy(){
  const retMode=window._getRetMode?window._getRetMode():'persen';
  if(retMode!=='persen') return;
  const retPct=parseFloat(document.getElementById('fp-pct')?.value||0);
  if(retPct<=0) return;
  const deployPct=parseFloat((100-retPct).toFixed(2));
  // Switch deploy to % mode if not already
  const dm=window._getDeployMode?window._getDeployMode():'rupiah';
  if(dm!=='persen') document.getElementById('fp-dmode-pct')?.click();
  const jpct=document.getElementById('fp-jpct');
  if(jpct) jpct.value=deployPct;
}
function updCalc(){
  const k=parseFloat(document.getElementById('fp-k')?.value||0);
  const j=getFormDeploy();
  const c=document.getElementById('fp-c');
  const hint=document.getElementById('fp-deploy-hint');
  if(!c) return;
  // show deploy hint in % mode
  const dm=window._getDeployMode?window._getDeployMode():'rupiah';
  if(hint){
    if(dm==='persen'&&k>0){const pct=parseFloat(document.getElementById('fp-jpct')?.value||0);hint.textContent=`${pct}% × ${fj(k)} = ${fj(k*pct/100)} keluar`;}
    else hint.textContent='Uang yang benar-benar keluar';
  }
  if(k<=0&&j<=0){c.style.display='none';return;}
  const rt=document.getElementById('fp-rt')?.value||'sekali';
  const kontrak=k||j;
  const deploy=j||k;
  if(rt==='bulanan'){
    const dur=parseInt(document.getElementById('fp-dur')?.value||0);
    const mode=window._getRetMode?window._getRetMode():'rupiah';
    let rb;
    if(mode==='persen'){
      const pct=parseFloat(document.getElementById('fp-pct')?.value||0);
      rb=kontrak*pct/100;
    } else {
      rb=parseFloat(document.getElementById('fp-rb')?.value||0);
    }
    if(rb>0&&dur>0){
      const totalProf=rb*dur;
      c.style.display='block';
      c.innerHTML=`💡 Kontrak <b>${fj(kontrak)}</b> · Deploy <b>${fj(deploy)}</b><br>
        Return: ${fj(rb)}/bln × ${dur} bln = <b style="color:#0B8F46">+${fj(totalProf)} profit</b><br>
        <span style="font-size:10px;color:var(--sub)">Pokok ${fj(deploy)} kembali di akhir · Total: ${fj(deploy+totalProf)}</span>`;
    } else {c.style.display='none';}
  } else {
    const totalProf=kontrak-deploy;
    c.style.display='block';
    c.innerHTML=`💡 Kontrak <b>${fj(kontrak)}</b> · Deploy <b>${fj(deploy)}</b><br>
      Di akhir kembali <b>${fj(kontrak)}</b> · Profit <b style="color:${totalProf>=0?'#0B8F46':'var(--r)'}">+${fj(totalProf)}</b>`;
  }
}
function updDue(){const m=document.getElementById('fp-m')?.value;if(m) document.getElementById('fp-jt').value=am(m,3);}
function savePrj(){
  const n=document.getElementById('fp-n')?.value?.trim();
  const k=parseFloat(document.getElementById('fp-k')?.value||0);
  const dm=window._getDeployMode?window._getDeployMode():'rupiah';
  let j;
  if(dm==='persen'){
    const dpct=parseFloat(document.getElementById('fp-jpct')?.value||0);
    j=k*dpct/100;
  } else {
    j=parseFloat(document.getElementById('fp-j')?.value||0);
  }
  const m=document.getElementById('fp-m')?.value;
  const jt=document.getElementById('fp-jt')?.value;
  const s=document.getElementById('fp-s')?.value;
  const ct=document.getElementById('fp-ct')?.value?.trim();
  const rt=document.getElementById('fp-rt')?.value||'sekali';
  if(!n){toast('❌ Nama wajib diisi');return;}
  if(!k||k<=0){toast('❌ Nilai kontrak wajib');return;}
  if(!j||j<=0){toast('❌ Jumlah deploy wajib');return;}
  if(!m||!jt){toast('❌ Tanggal wajib diisi');return;}
  const kontrak=k;
  const deployPersen=dm==='persen'?parseFloat(document.getElementById('fp-jpct')?.value||0):0;
  const adminFeePersen=parseFloat(document.getElementById('fp-adminfee')?.value||0);
  const adminFeeRecipient=document.getElementById('fp-adminfee-to')?.value?.trim()||'Mas Hena';
  const data={peminjam:n,kontrak,jumlah:parseFloat(j.toFixed(2)),deployMode:dm,deployPersen,adminFeePersen,adminFeeRecipient,returnType:rt,tanggalMulai:m,tanggalJT:jt,status:s,catatan:ct};
  if(!eP) data.deployBasis=true;
  if(rt==='bulanan'){
    const dur=parseInt(document.getElementById('fp-dur')?.value||0);
    const mode=window._getRetMode?window._getRetMode():'rupiah';
    let rb,pct=0;
    if(mode==='persen'){
      pct=parseFloat(document.getElementById('fp-pct')?.value||0);
      rb=kontrak*pct/100;
    } else {
      rb=parseFloat(document.getElementById('fp-rb')?.value||0);
    }
    if(!rb||!dur){toast('❌ Isi return & durasi');return;}
    data.returnMode=mode;
    data.returnBulanan=rb;
    data.returnPersen=pct;
    data.durasiReturn=dur;
    data.returnTotal=j+rb*dur;
    // umum return fields
    const modeU=window._getRetModeUmum?window._getRetModeUmum():'rupiah';
    let rbU=0,pctU=0;
    if(modeU==='persen'){
      pctU=parseFloat(document.getElementById('fp-upct')?.value||0);
      rbU=kontrak*pctU/100;
    } else {
      rbU=parseFloat(document.getElementById('fp-urb')?.value||0);
    }
    data.returnModeUmum=modeU;
    data.returnBulananUmum=rbU;
    data.returnPersenUmum=pctU;
  } else {
    data.returnTotal=kontrak;
    // sekali umum fields
    const sm=window._getSekaliModeUmum?window._getSekaliModeUmum():'persen';
    data.sekaliModeUmum=sm;
    if(sm==='persen'){
      data.sekaliUmumPersen=parseFloat(document.getElementById('fp-su-pct-val')?.value||0);
      data.sekaliUmumRp=kontrak*data.sekaliUmumPersen/100;
    } else {
      data.sekaliUmumRp=parseFloat(document.getElementById('fp-su-rp-val')?.value||0);
      data.sekaliUmumPersen=0;
    }
  }
  if(eP){
    const i=S.projects.findIndex(p=>p.id===eP);
    if(i>=0){
      const prev=S.projects[i];
      S.projects[i]={...prev,...data};
      // Force schedule regen if tanggalMulai/durasiReturn changed
      if(prev.tanggalMulai!==data.tanggalMulai||prev.durasiReturn!==data.durasiReturn){
        if(S.projects[i].schedule){
          S.projects[i].schedule.forEach((s,idx)=>{
            if(s.status!=='paid') s.dueDate=am(data.tanggalMulai,idx+1);
          });
        }
      }
    }
    toast('✅ Diupdate!');
  }
  else{S.projects.push({id:uid(),...data,payments:[]});toast('🎉 Ditambahkan!');}
  save();cm('mo-p');rAll();
}
function delProj(id){
  const idx=S.projects.findIndex(p=>p.id===id);
  if(idx<0) return;
  const removed=S.projects[idx];
  S.projects.splice(idx,1);
  save();cm('mo-p');cm('mo-det');rAll();
  toast(`🗑️ Proyek "${removed.peminjam}" dihapus`,{
    duration:6000,
    undo:()=>{S.projects.splice(idx,0,removed);save();rAll();toast('↩ Dipulihkan');}
  });
}

function activateProject(pid){
  const p=S.projects.find(x=>x.id===pid);
  if(!p) return;
  const date=document.getElementById('ap-date')?.value;
  if(!date){toast('❌ Tanggal wajib diisi');return;}
  const rows=[...document.querySelectorAll('.ap-row')];
  const allocations=rows.map(r=>{
    const sel=r.querySelector('.ap-inv')?.value;
    const name=r.querySelector('.ap-name')?.value?.trim();
    const amt=parseFloat(r.querySelector('.ap-amt')?.value||0);
    if(!sel||!amt||amt<=0) return null;
    if(sel.startsWith('existing-')){
      return {kind:'existing',id:sel.replace('existing-',''),amount:amt};
    } else if(sel==='new'){
      if(!name){toast('❌ Nama pemodal baru wajib');return null;}
      return {kind:'new',name,amount:amt};
    }
    return null;
  }).filter(Boolean);

  // Apply
  p.tanggalAktif=date;
  p.status='aktif';
  let pemodalCount=0;
  allocations.forEach(pm=>{
    if(pm.kind==='existing'){
      const inv=S.external.find(e=>e.id===pm.id);
      if(inv){
        inv.alokasi=inv.alokasi||[];
        // Replace if allocation to this project already exists, otherwise push
        const exIdx=inv.alokasi.findIndex(a=>a.pid===pid);
        if(exIdx>=0) inv.alokasi[exIdx]={pid,jumlah:pm.amount};
        else inv.alokasi.push({pid,jumlah:pm.amount});
        // Bump jumlah by the new allocation amount (assume new contribution)
        inv.jumlah=parseFloat(inv.jumlah||0)+pm.amount;
        pemodalCount++;
      }
    } else {
      S.external.push({
        id:uid(),
        tipe:'investor',
        nama:pm.name,
        jumlah:pm.amount,
        bagiHasilPct:0,
        alokasi:[{pid,jumlah:pm.amount}],
        status:'aktif',
        tanggal:date,
        catatan:''
      });
      pemodalCount++;
    }
  });
  save();cm('mo-det');rAll();
  toast(pemodalCount>0?`🚀 Proyek aktif · ${pemodalCount} pemodal`:'🚀 Proyek aktif');
}

function undoActivation(pid){
  if(!confirm('Batalkan masuk proyek?\n\nStatus akan kembali ke Tersedia. Semua alokasi pemodal di proyek ini akan dihapus & total dana mereka dikurangi.\n\nLanjutkan?')) return;
  const p=S.projects.find(x=>x.id===pid);
  if(!p) return;
  // Remove this project's allocations from all investors, reduce their jumlah
  S.external.forEach(e=>{
    if(!e.alokasi) return;
    const removed=e.alokasi.filter(a=>a.pid===pid);
    const removedSum=removed.reduce((s,a)=>s+parseFloat(a.jumlah||0),0);
    e.alokasi=e.alokasi.filter(a=>a.pid!==pid);
    e.jumlah=Math.max(0,parseFloat(e.jumlah||0)-removedSum);
  });
  // Remove fully-empty new pemodal that have no other allocations and no other context
  S.external=S.external.filter(e=>{
    if(e.tipe!=='investor') return true;
    // Keep if has other allocations OR has jumlah > 0
    return (e.alokasi&&e.alokasi.length>0)||parseFloat(e.jumlah||0)>0.001;
  });
  // Reset project
  delete p.tanggalAktif;
  p.status='tersedia';
  if(p.schedule){
    p.schedule.forEach(s=>{
      if(s.status!=='paid') s.status='pending';
    });
  }
  save();cm('mo-det');rAll();
  toast('↩️ Masuk proyek dibatalkan');
}

function savePay(pid){
  const j=parseFloat(document.getElementById('py-j')?.value);
  const t=document.getElementById('py-t')?.value;
  const c=document.getElementById('py-c')?.value||'';

// ── SCHEDULE PAYMENT ──────────────────────────────────────────────────
function confirmSchedulePay(pid, month){
  const p=S.projects.find(x=>x.id===pid); if(!p) return;
  const rt=p.returnType||'sekali';
  const today=new Date().toISOString().split('T')[0];
  let defAmt, defNote;
  if(rt==='bulanan'){
    generateSchedule(p);
    const item=p.schedule.find(s=>s.month===month);
    if(!item||item.status==='paid') return;
    defAmt=item.amount+(item.isFinal?parseFloat(p.jumlah):0);
    defNote=`Bulan ${month}${item.isFinal?' + Pokok':''}`;
  } else {
    defAmt=kontrakP(p);
    defNote='Pengembalian sekali';
  }
  // Show inline edit form
  const formId='spay-form-'+month;
  const existing=document.getElementById(formId);
  if(existing){existing.remove();return;}
  // Remove any other open forms
  document.querySelectorAll('[id^="spay-form-"]').forEach(el=>el.remove());
  const row=document.getElementById('srow-'+pid+'-'+month);
  if(!row) return;
  const form=document.createElement('div');
  form.id=formId;
  form.style.cssText='background:var(--p-l);border-radius:14px;padding:14px;margin-top:8px';
  form.innerHTML=`
    <div class="fr" style="margin-bottom:8px">
      <div class="fg" style="margin:0"><label class="fl">Jumlah (jt)</label><input class="fi" id="sp-amt-${month}" type="number" step="0.01" value="${defAmt}"></div>
      <div class="fg" style="margin:0"><label class="fl">Tanggal</label><input class="fi" id="sp-date-${month}" type="date" value="${today}"></div>
    </div>
    <div class="fg" style="margin-bottom:10px"><label class="fl">Catatan</label><input class="fi" id="sp-note-${month}" value="${defNote}" placeholder="Opsional"></div>`;
  const btnRow=document.createElement('div');
  btnRow.style.cssText='display:flex;gap:8px';
  const saveBtn=document.createElement('button');
  saveBtn.className='btn gr fw';saveBtn.textContent='✅ Simpan';
  saveBtn.onclick=function(){
    const amt=parseFloat(document.getElementById('sp-amt-'+month)?.value||0);
    const date=document.getElementById('sp-date-'+month)?.value||today;
    const note=document.getElementById('sp-note-'+month)?.value||'';
    if(!amt||amt<=0){toast('❌ Jumlah wajib');return;}
    if(rt==='bulanan'){
      const item2=p.schedule.find(s2=>s2.month===month);
      if(item2){item2.status='paid';item2.paidDate=date;item2.paidAmount=amt;item2.catatan=note;}
      if(!p.payments) p.payments=[];
      p.payments.push({id:uid(),tanggal:date,jumlah:amt,catatan:note});
      if(p.schedule.every(s2=>s2.status==='paid')) p.status='selesai';
    } else {
      if(!p.payments) p.payments=[];
      p.payments.push({id:uid(),tanggal:date,jumlah:amt,catatan:note});
      p.status='selesai';
    }
    save();oDet(pid);rAll();
    toast('✅ Pembayaran dicatat!');
  };
  const cancelBtn=document.createElement('button');
  cancelBtn.className='btn ou fw';cancelBtn.textContent='Batal';
  cancelBtn.onclick=function(){form.remove();};
  btnRow.appendChild(saveBtn);btnRow.appendChild(cancelBtn);
  form.appendChild(btnRow);
  row.after(form);
}

    const date=document.getElementById('sp-date-'+month)?.value||'';
    const note=document.getElementById('sp-note-'+month)?.value||'';
    if(!amt||amt<=0){toast('❌ Jumlah wajib');return;}

function addInvRowData(pid,jumlah,pct){
  const rowsEl=document.getElementById('inv-alloc-rows'); if(!rowsEl) return;
  const row=document.createElement('div');
  row.style.cssText='display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;margin-bottom:8px;align-items:center';
  const projSel=document.createElement('select');projSel.className='fi fs inv-pid';projSel.style.fontSize='11px';
  // Filter projects: must be aktif/terlambat AND still have capacity (not fully funded).
  // Always include the currently-allocated project so existing allocations remain editable.
  const activeProjects=S.projects.filter(p=>{
    if(p.id===pid) return true; // keep current allocation visible
    if(p.status!=='aktif'&&p.status!=='terlambat') return false;
    // Capacity check: sum allocations from OTHER investors (skip the one being edited)
    const deploy=parseFloat(p.jumlah||0);
    if(deploy<=0) return true; // no deploy → no cap check
    let allocatedByOthers=0;
    S.external.forEach(e=>{
      if(e.tipe!=='investor') return;
      if(eE&&e.id===eE) return; // exclude current investor's own existing allocations
      (e.alokasi||[]).forEach(a=>{ if(a.pid===p.id) allocatedByOthers+=parseFloat(a.jumlah||0); });
    });
    return allocatedByOthers<deploy-0.001; // tiny epsilon for float precision
  });
  projSel.innerHTML=`<option value="">-- Proyek --</option>${activeProjects.map(p=>{
    // Show remaining capacity in label so user knows how much is left
    const deploy=parseFloat(p.jumlah||0);
    let allocByOthers=0;
    S.external.forEach(e=>{
      if(e.tipe!=='investor') return;
      if(eE&&e.id===eE) return;
      (e.alokasi||[]).forEach(a=>{ if(a.pid===p.id) allocByOthers+=parseFloat(a.jumlah||0); });
    });
    const remaining=deploy-allocByOthers;
    const remLbl=deploy>0?` · sisa ${fj(remaining)}`:'';
    return `<option value="${p.id}"${p.id===pid?' selected':''}>${p.peminjam} (${fj(kontrakP(p))}${remLbl})</option>`;
  }).join('')}`;
  const jmlIn=document.createElement('input');jmlIn.className='fi inv-jml';jmlIn.type='number';jmlIn.step='0.01';jmlIn.placeholder='jt';jmlIn.value=jumlah||'';jmlIn.style.fontSize='11px';
  const pctIn=document.createElement('input');pctIn.className='fi inv-pct';pctIn.type='number';pctIn.step='0.1';pctIn.placeholder='%';pctIn.value=pct||'';pctIn.style.fontSize='11px';
  // Auto-calc: nominal ↔ % kepemilikan (based on deploy value, not contract value)
  function getDeploy(){ const sel=projSel.value; const pp=S.projects.find(x=>x.id===sel); return pp?parseFloat(pp.jumlah||0):0; }
  jmlIn.addEventListener('input',()=>{ const dep=getDeploy(); if(dep>0){pctIn.value=((parseFloat(jmlIn.value||0)/dep)*100).toFixed(1);} updInvIdle(); });
  pctIn.addEventListener('input',()=>{ const dep=getDeploy(); if(dep>0){jmlIn.value=((parseFloat(pctIn.value||0)/100)*dep).toFixed(2);} updInvIdle(); });
  projSel.addEventListener('change',()=>{ const dep=getDeploy(); if(dep>0&&jmlIn.value){pctIn.value=((parseFloat(jmlIn.value||0)/dep)*100).toFixed(1);} updInvIdle(); });
  const rmBtn=document.createElement('button');rmBtn.type='button';rmBtn.style.cssText='background:var(--r-l);color:var(--r);border:none;border-radius:8px;width:30px;height:36px;font-size:14px;cursor:pointer';rmBtn.textContent='×';
  rmBtn.onclick=()=>{row.remove();updInvIdle();};
  row.appendChild(projSel);row.appendChild(jmlIn);row.appendChild(pctIn);row.appendChild(rmBtn);
  rowsEl.appendChild(row);
}
function updInvIdle(){
  const j=parseFloat(document.getElementById('fe-j')?.value||0);
  const total=Array.from(document.querySelectorAll('.inv-jml')).reduce((s,r)=>s+parseFloat(r.value||0),0);
  const idle=j-total;
  const tEl=document.getElementById('inv-alloc-total');
  const iEl=document.getElementById('inv-idle');
  if(tEl) tEl.textContent=fj(total);
  if(iEl){iEl.textContent=fj(idle);iEl.style.color=idle<0?'var(--r)':idle>0?'#B56B00':'#0B8F46';}
}
function getPinjTipe(){return document.getElementById('fe-tp')?.value||'angsuran';}
function updPinjFields(){
  const tp=getPinjTipe();
  const cbWrap=document.getElementById('fg-cb');
  const lbl=document.getElementById('lbl-jb');
  const fhB=document.getElementById('fh-bunga');
  if(tp==='angsuran'){
    if(cbWrap)cbWrap.style.display='';
    if(lbl)lbl.textContent='Jadwal Bayar Berikutnya';
    if(fhB)fhB.textContent='Isi → cicilan auto';
  } else if(tp==='bunga_saja'){
    if(cbWrap)cbWrap.style.display='none';
    if(lbl)lbl.textContent='Jadwal Bayar Bunga Berikutnya';
    if(fhB)fhB.textContent='Bunga dibayar tiap bulan';
  } else {
    if(cbWrap)cbWrap.style.display='none';
    if(lbl)lbl.textContent='Tanggal Jatuh Tempo';
    if(fhB)fhB.textContent='Semua dibayar di akhir';
  }
  calcC();
}
function calcC(){
  const j=parseFloat(document.getElementById('fe-j')?.value||0);
  const dur=parseFloat(document.getElementById('fe-dur')?.value||0);
  const b=parseFloat(document.getElementById('fe-b')?.value||0);
  const tp=getPinjTipe();
  const cb=document.getElementById('fe-cb');
  if(tp==='angsuran'&&cb&&j>0&&b>0) cb.value=dur>0?(j/dur+j*b/100).toFixed(2):(j*b/100).toFixed(2);
  updPinjInfo();
}
function calcBunga(){
  const j=parseFloat(document.getElementById('fe-j')?.value||0);
  const dur=parseFloat(document.getElementById('fe-dur')?.value||0);
  const cb=parseFloat(document.getElementById('fe-cb')?.value||0);
  const bEl=document.getElementById('fe-b');
  if(bEl&&j>0&&dur>0&&cb>0) bEl.value=((cb-j/dur)/j*100).toFixed(2);
  else if(bEl&&j>0&&cb>0) bEl.value=(cb/j*100).toFixed(2);
  updPinjInfo();
}
function updPinjInfo(){
  const j=parseFloat(document.getElementById('fe-j')?.value||0);
  const dur=parseFloat(document.getElementById('fe-dur')?.value||0);
  const b=parseFloat(document.getElementById('fe-b')?.value||0);
  const el=document.getElementById('pinj-info'); if(!el) return;
  const tp=getPinjTipe();
  const bungaBln=j*b/100;
  let rows=[];
  if(tp==='angsuran'){
    const cb=parseFloat(document.getElementById('fe-cb')?.value||0);
    if(j>0&&dur>0&&cb>0){const total=cb*dur;rows=[['Total bayar',fj(total)],['Total bunga',fj(total-j)]];}
  } else if(tp==='bunga_saja'){
    if(j>0&&b>0&&dur>0){const tb=bungaBln*dur;rows=[['Bunga/bulan',fj(bungaBln)],['Total bunga',fj(tb)],['Total bayar',fj(j+tb)]];}
  } else {
    if(j>0&&b>0&&dur>0){const tb=bungaBln*dur;rows=[['Total bunga',fj(tb)],['Bayar di akhir',fj(j+tb)]];}
  }
  if(rows.length>0){
    el.classList.add('show');
    el.innerHTML=rows.map(r=>`<div class="ps-row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
  } else {
    el.classList.remove('show');
    el.innerHTML='';
  }
}
function addUtangOwnerRow(ownerId,jumlah){
  const rowsEl=document.getElementById('utang-owner-rows');if(!rowsEl)return;
  const owners=S.external.filter(x=>x.tipe==='investor'&&x.isOwner);
  const row=document.createElement('div');
  row.className='utang-owner-row';
  row.style.cssText='display:grid;grid-template-columns:2fr 1fr auto;gap:6px;align-items:center';
  const sel=document.createElement('select');
  sel.className='fi fs uo-id';sel.style.fontSize='11px';
  sel.innerHTML=`<option value="">-- Pilih Owner --</option>${owners.map(o=>`<option value="${o.id}"${o.id===ownerId?' selected':''}>${o.nama}</option>`).join('')}<option value="_new">+ Owner baru</option>`;
  const jml=document.createElement('input');
  jml.className='fi uo-amt';jml.type='number';jml.step='0.01';jml.placeholder='jt';jml.value=jumlah||'';jml.style.fontSize='11px';
  const rm=document.createElement('button');
  rm.type='button';rm.style.cssText='background:var(--r-l);color:var(--r);border:none;border-radius:8px;width:30px;height:36px;font-size:14px;cursor:pointer';rm.textContent='×';
  rm.onclick=()=>{row.remove();updUtangOwnerSummary();};
  // If "+ Owner baru" picked, show inline name input row underneath
  const nameWrap=document.createElement('div');
  nameWrap.style.cssText='grid-column:1/-1;display:none';
  const nameInp=document.createElement('input');
  nameInp.className='fi uo-newname';nameInp.type='text';nameInp.placeholder='Nama owner baru';nameInp.style.cssText='font-size:11px;margin-top:4px';
  nameWrap.appendChild(nameInp);
  sel.addEventListener('change',()=>{nameWrap.style.display=sel.value==='_new'?'block':'none';updUtangOwnerSummary();});
  jml.addEventListener('input',updUtangOwnerSummary);
  row.appendChild(sel);row.appendChild(jml);row.appendChild(rm);
  rowsEl.appendChild(row);
  rowsEl.appendChild(nameWrap);

function updUtangOwnerSummary(){
  const total=[...document.querySelectorAll('.uo-amt')].reduce((s,i)=>s+parseFloat(i.value||0),0);
  const utangTotal=parseFloat(document.getElementById('fe-j')?.value||0);
  const remaining=utangTotal-total;
  const el=document.getElementById('utang-owner-summary');if(!el)return;
  if(utangTotal===0){el.textContent='Isi jumlah utang dulu';return;}
  const okColor=Math.abs(remaining)<0.01?'#0B8F46':remaining<0?'var(--r)':'#B45309';
  const okLbl=Math.abs(remaining)<0.01?'✓ Pas':remaining<0?`Kelebihan ${fj(-remaining)}`:`Sisa ${fj(remaining)}`;
  el.innerHTML=`Total alokasi: <b>${fj(total)}</b> · <span style="color:${okColor}">${okLbl}</span>`;
}
function setInvOwnerType(isOwner){
  const hidden=document.getElementById('fe-isowner');
  const owBtn=document.getElementById('fe-tipe-owner');
  const noBtn=document.getElementById('fe-tipe-nonowner');
  const hint=document.getElementById('fe-owner-hint');
  const bhWrap=document.getElementById('fe-bh-wrap');
  if(hidden) hidden.value=isOwner?'1':'0';
  if(owBtn){owBtn.classList.toggle('pr',isOwner);owBtn.classList.toggle('ou',!isOwner);}
  if(noBtn){noBtn.classList.toggle('pr',!isOwner);noBtn.classList.toggle('ou',isOwner);}
  if(hint) hint.textContent=isOwner?'Owner: inherit sisa profit setelah investor non-owner dibayar.':'Non-owner: bagi hasil fixed sesuai rate proyek.';
  if(bhWrap) bhWrap.style.display=isOwner?'none':'';
}
function saveExt(tipe){
  const n=document.getElementById('fe-n')?.value?.trim();
  const j=parseFloat(document.getElementById('fe-j')?.value);
  const st2=document.getElementById('fe-st')?.value;
  const ct=document.getElementById('fe-ct')?.value?.trim();
  const t=document.getElementById('fe-t')?.value;
  if(!n){toast('❌ Nama wajib');return;}
  if(!j||j<=0){toast('❌ Jumlah wajib');return;}
  let obj={tipe,nama:n,jumlah:j,status:st2,catatan:ct,tanggal:t};
  if(tipe==='pinjaman'){
    const tp=document.getElementById('fe-tp')?.value||'angsuran';
    const bungaPct=parseFloat(document.getElementById('fe-b')?.value||0);
    const durasi=parseInt(document.getElementById('fe-dur')?.value||0);
    let cicilanBulan=0;
    if(tp==='angsuran') cicilanBulan=parseFloat(document.getElementById('fe-cb')?.value||0);
    else if(tp==='bunga_saja') cicilanBulan=parseFloat((j*bungaPct/100).toFixed(4));
    obj={...obj,tipePinjaman:tp,durasi,bungaPct,cicilanBulan,jadwalBayar:document.getElementById('fe-jb')?.value};
    // Collect assignedOwners — create new owner inline if "_new" selected
    const ownerRows=[...document.querySelectorAll('.utang-owner-row')];
    const assignedOwners=[];
    ownerRows.forEach(row=>{
      const sel=row.querySelector('.uo-id')?.value;
      const amt=parseFloat(row.querySelector('.uo-amt')?.value||0);
      if(!sel||!amt||amt<=0) return;
      let ownerId=sel;
      if(sel==='_new'){
        // Create new owner inline — name input is in NEXT sibling div
        const wrap=row.nextElementSibling;
        const nameInput=wrap?.querySelector('.uo-newname');
        const name=nameInput?.value?.trim();
        if(!name){toast('❌ Nama owner baru wajib');return;}
        const newOwner={id:uid(),tipe:'investor',isOwner:true,nama:name,jumlah:0,bagiHasilPct:0,alokasi:[],status:'aktif',tanggal:t};
        S.external.push(newOwner);
        ownerId=newOwner.id;
      }
      assignedOwners.push({ownerId,jumlah:amt});
    });
    obj.assignedOwners=assignedOwners;
  } else {
    const isOwner=document.getElementById('fe-isowner')?.value==='1';
    const bh=parseFloat(document.getElementById('fe-bh')?.value||0);
    obj.isOwner=isOwner;
    const alok=Array.from(document.getElementById('inv-alloc-rows')?.children||[]).map(row=>{
      const pid=row.querySelector('.inv-pid')?.value;
      const jmlVal=parseFloat(row.querySelector('.inv-jml')?.value||0);
      const pctVal=parseFloat(row.querySelector('.inv-pct')?.value||0);
      return pid?{pid,jumlah:jmlVal,pctProyek:pctVal}:null;
    }).filter(Boolean);
    obj={...obj,bagiHasilPct:bh,alokasi:alok};
  }
  if(eE){const i=S.external.findIndex(e=>e.id===eE);if(i>=0) S.external[i]={...S.external[i],...obj};toast('✅ Diupdate!');}
  else{S.external.push({id:uid(),...obj});toast('🎉 Ditambahkan!');}
  save();cm('mo-ext');rE();
}
function delExt(id){
  const idx=S.external.findIndex(e=>e.id===id);
  if(idx<0)return;
  const removed=S.external[idx];
  S.external.splice(idx,1);
  save();cm('mo-ext');cm('mo-edet');rE();
  toast(`🗑️ "${removed.nama}" dihapus`,{
    duration:6000,
    undo:()=>{S.external.splice(idx,0,removed);save();rE();toast('↩ Dipulihkan');}
  });
}

// ── EXTERNAL DETAIL ───────────────────────────────────────────────────
function oEDet(id){
  const e=S.external.find(x=>x.id===id); if(!e) return;
  const isPinj=e.tipe==='pinjaman';
  const el=document.getElementById('mo-edet-b');
  let h=`
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button onclick="cm('mo-edet')" style="background:var(--bdr);border:none;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub)">✕</button></div>
    <div class="fb mb12"><div style="font-size:17px;font-weight:900">${e.nama}</div><span class="bdg ${e.tipe}">${isPinj?'💙 Pinjaman':'🟠 Investor'}</span></div>
    <div class="ir"><span class="ik">Jumlah Dana</span><span class="iv" style="color:${isPinj?'#0369A1':'#B56B00'}">${fj(e.jumlah)}</span></div>
    <div class="ir"><span class="ik">Status</span><span class="iv">${e.status==='selesai'?'✅ Selesai':'🔵 Aktif'}</span></div>
    <div class="ir"><span class="ik">Tanggal</span><span class="iv">${fd(e.tanggal)}</span></div>`;
  if(isPinj){
    h+=`<div class="ir"><span class="ik">Suku Bunga</span><span class="iv tblu">${e.bungaPct||0}%/bln</span></div>
    <div class="ir"><span class="ik">Cicilan/Bulan</span><span class="iv tred">${fj(e.cicilanBulan)}</span></div>
    ${e.durasi?`<div class="ir"><span class="ik">Durasi</span><span class="iv">${e.durasi} bulan</span></div>`:''}
    ${e.jadwalBayar?`<div class="ir"><span class="ik">Jadwal Bayar</span><span class="iv" style="color:${gc(du(e.jadwalBayar))}">${fd(e.jadwalBayar)}</span></div>`:''}`;
  } else {
    const aP=(e.alokasi||[]).map(a=>{const pp=S.projects.find(p=>p.id===a.pid);return pp?{...a,peminjam:pp.peminjam}:null;}).filter(Boolean);
    h+=`<div class="ir"><span class="ik">Bagi Hasil Default</span><span class="iv torg">${e.bagiHasilPct||0}%</span></div>`;
    if(aP.length>0){
      h+=`<div class="dv"></div><div style="font-weight:900;font-size:13px;margin-bottom:8px">📌 Alokasi Proyek</div>`;
      aP.forEach(a=>{const pp=S.projects.find(p=>p.id===a.pid);const profBase=pp?prof(a.jumlah||pp.jumlah):0;const pct=a.bagiHasilPct||e.bagiHasilPct||0;h+=`<div class="pi"><div><div style="font-weight:800;font-size:12px">${a.peminjam}</div><div class="txx tg">${fj(a.jumlah)} · ${pct}% bagi hasil</div></div><div class="tred tbold">-${fj(profBase*pct/100)}</div></div>`;});
    }
  }
  if(e.catatan) h+=`<div class="ir"><span class="ik">Catatan</span><span class="iv">${e.catatan}</span></div>`;
  el.innerHTML=h;
  const dv=document.createElement('div');dv.className='dv';el.appendChild(dv);
  const br=document.createElement('div');br.style.cssText='display:flex;gap:8px';
  const eb=document.createElement('button');eb.className='btn ou fw';eb.textContent='✏️ Edit';eb.onclick=()=>{cm('mo-edet');oEM(e.id);};br.appendChild(eb);
  if(e.status!=='selesai'){const db=document.createElement('button');db.className='btn gr';db.textContent='✅ Selesai';db.onclick=()=>mExtDone(e.id);br.appendChild(db);}
  el.appendChild(br);
  om('mo-edet');
}
function mExtDone(id){const i=S.external.findIndex(e=>e.id===id);if(i>=0){S.external[i].status='selesai';save();cm('mo-edet');rE();toast('✅ Selesai!');}}

// ── RENDER ALL ────────────────────────────────────────────────────────
function fixScheduleDates(){
  // One-time migration: realign all unpaid schedule dueDates with tanggalMulai
  let changed=false;
  S.projects.forEach(p=>{
    if(!p.schedule||!p.tanggalMulai) return;
    p.schedule.forEach((s,idx)=>{
      const expected=am(p.tanggalMulai,idx+1);
      if(s.dueDate!==expected&&s.status!=='paid'){
        s.dueDate=expected;
        changed=true;
      }
    });
  });
  if(changed) save();
}
function fixProjectStatuses(){
  fixScheduleDates();
  let changed=false;
  S.projects.forEach(p=>{
    if(p.status!=='aktif'&&p.status!=='terlambat') return;
    const nd=getNextDue(p);
    if(nd){
      const d=du(nd.dueDate);
      if(d!==null&&d<0&&p.status==='aktif'){p.status='terlambat';changed=true;}
      else if((d===null||d>=0)&&p.status==='terlambat'){p.status='aktif';changed=true;}
    }
  });
  if(changed) save();
}
function rAll(){
  fixProjectStatuses();
  try {
    if(CP==='b') rB();
    else if(CP==='m') rM();
    else if(CP==='k') rK();
    else if(CP==='e') rE();
  } catch(e) {
    console.error('Render error:', e);
  }
  // Keep the scroll-lock consistent with the actual modal state after a render.
  // Pages are native-flow blocks now, so there is no inner scroller to un-freeze.
  syncModalState();
}

// ── PIN & ADMIN ──────────────────────────────────────────────────────
let _adminUnlocked=false;

function buildPinPad(){
  const dots=document.getElementById('pin-dots');
  const pad=document.getElementById('pin-pad');
  dots.innerHTML='';pad.innerHTML='';
  for(let i=0;i<6;i++){const d=document.createElement('div');d.style.cssText='width:14px;height:14px;border-radius:50%;border:2.5px solid rgba(255,255,255,.5);transition:all .15s';d.id='dot-'+i;dots.appendChild(d);}
  let pin=[];
  const bs='width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:22px;font-weight:900;cursor:pointer;font-family:Nunito,sans-serif;transition:all .1s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none';
  for(let n=1;n<=9;n++){const b=document.createElement('button');b.style.cssText=bs;b.textContent=n;b.onclick=()=>addDigit(n);pad.appendChild(b);}
  pad.appendChild(document.createElement('div'));
  const b0=document.createElement('button');b0.style.cssText=bs;b0.textContent='0';b0.onclick=()=>addDigit(0);pad.appendChild(b0);
  const bd=document.createElement('button');bd.style.cssText=bs+';font-size:16px';bd.textContent='\u232B';bd.onclick=()=>{if(pin.length>0){pin.pop();upd();}};pad.appendChild(bd);
  function upd(){for(let i=0;i<6;i++){document.getElementById('dot-'+i).style.background=i<pin.length?'#fff':'transparent';}}
  function addDigit(n){
    if(pin.length>=6)return;pin.push(n);upd();
    if(pin.length===6){
      const code=pin.join('');
      if(code==='110869'){_pin=code;unlockAdmin();}
      else{document.getElementById('pin-error').textContent='\u274C PIN salah!';pin=[];setTimeout(()=>{upd();document.getElementById('pin-error').textContent='';},1200);}
    }
  }
}

function showPin(){
  if(_adminUnlocked){go('m');return;}
  buildPinPad();
  om('mo-pin');
}

async function unlockAdmin(){
  _adminUnlocked=true;
  cm('mo-pin');
  // Show admin tabs, hide admin button
  document.getElementById('n-m').style.display='';
  document.getElementById('n-k').style.display='';
  document.getElementById('n-e').style.display='';
  document.getElementById('n-u').style.display='';
  document.getElementById('n-admin').style.display='none';
  // Load from Firestore
  await loadFromFirestore();
  rAll();
  toast('🔓 Admin unlocked!');
  go('m');
}

load();
go('b');
// Load from cloud for everyone (not just admin) — with retry
(async function initCloud(){
  for(let i=0;i<5;i++){
    try{
      if(typeof db==='undefined'){await new Promise(r=>setTimeout(r,500));continue;}
      const snap=await db.collection('danatrack').doc(DOC_ID).get();
      if(snap.exists){
        const d=snap.data();
        S={...S,...d.state};
        localStorage.setItem('dt_v3',JSON.stringify(S));
        rAll();
        console.log('✅ Cloud data loaded:',S.projects.length,'projects');
      } else {
        console.log('No cloud data yet');
      }
      return;
    }catch(e){
      console.warn('Cloud load attempt '+(i+1)+':',e.message);
      await new Promise(r=>setTimeout(r,1000));
    }
  }
  console.warn('Cloud load failed after retries');
})();
