<style>
:root{
  /* === Phantom Brand === */
  --p:#AB9FF2;--p-deep:#8B5CF6;--p-darker:#7C3AED;--p-l:#F5F3FF;--p-l2:#EDE9FE;
  --p2:#EC4899;
  /* === Phantom Dark === */
  --phantom-deep:#0F0524;--phantom-violet:#7C3AED;--phantom-pink:#EC4899;--phantom-cyan:#22D3EE;
  /* === Claymorphism warm pastels === */
  --clay-bg:#F4F2F8;--clay-card:#FBFAFD;
  --clay-mint:#D1FAE5;--clay-lilac:#EDE9FE;--clay-peach:#FED7AA;--clay-sky:#DBEAFE;--clay-rose:#FFE4E6;--clay-cream:#FEF3C7;
  /* === Surfaces (purple-tinted neutrals, no pure white) === */
  --bg:#F4F2F8;--card:#FBFAFD;--card-2:#F8F6FB;--surface-2:#F5F3FF;
  --txt:#1A1325;--sub:#7B7A99;--bdr:#E0DBED;
  /* === Status === */
  --g:#22C55E;--g-l:#DCFCE7;--g-deep:#16A34A;--g-darker:#15803D;
  --o:#F59E0B;--o-l:#FEF3C7;--o-darker:#B45309;
  --r:#EF4444;--r-l:#FEE2E2;--r-darker:#B91C1C;
  --b:#3B82F6;--b-l:#DBEAFE;--b-darker:#1D4ED8;
  /* === Gradients === */
  --grad-hero:linear-gradient(135deg,#AB9FF2 0%,#8B5CF6 50%,#EC4899 100%);
  --grad-phantom:linear-gradient(135deg,#0F0524 0%,#1A1325 25%,#3B2169 60%,#7C3AED 100%);
  --grad-purple:linear-gradient(135deg,#8B5CF6 0%,#A78BFA 100%);
  --grad-success:linear-gradient(135deg,#22C55E 0%,#10B981 100%);
  --grad-warn:linear-gradient(135deg,#F59E0B 0%,#EF4444 100%);
  /* === Layout === */
  --nav:88px;--hdr:0px;
  /* === Radii === */
  --rad-xs:10px;--rad-s:14px;--rad:18px;--rad-lg:22px;--rad-xl:28px;--rad-2xl:32px;
  /* === CLAYMORPHISM DOUBLE SHADOWS (signature look) === */
  --clay-out:6px 6px 14px rgba(124,58,237,.12),-6px -6px 14px rgba(255,255,255,.95);
  --clay-out-sm:3px 3px 8px rgba(124,58,237,.10),-3px -3px 8px rgba(255,255,255,.9);
  --clay-out-lg:10px 10px 24px rgba(124,58,237,.15),-10px -10px 24px rgba(255,255,255,.95);
  --clay-in:inset 3px 3px 7px rgba(124,58,237,.12),inset -3px -3px 7px rgba(255,255,255,.85);
  --clay-pressed:inset 5px 5px 12px rgba(124,58,237,.18),inset -5px -5px 12px rgba(255,255,255,.7);
  /* Status-tinted shadows */
  --clay-out-green:6px 6px 14px rgba(22,163,74,.18),-6px -6px 14px rgba(255,255,255,.95);
  --clay-out-red:6px 6px 14px rgba(220,38,38,.18),-6px -6px 14px rgba(255,255,255,.95);
  --clay-out-orange:6px 6px 14px rgba(245,158,11,.18),-6px -6px 14px rgba(255,255,255,.95);
  --clay-out-gray:6px 6px 14px rgba(100,116,139,.15),-6px -6px 14px rgba(255,255,255,.95);
  /* Glass blur */
  --glass-bg:rgba(255,255,255,0.65);
  --glass-border:rgba(255,255,255,0.5);
  /* === EASING === */
  --ease-bounce:cubic-bezier(0.34,1.56,0.64,1);
  --ease-smooth:cubic-bezier(0.4,0,0.2,1);
  --dur-fast:150ms;--dur-normal:250ms;--dur-slow:400ms;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;overflow-x:hidden;overscroll-behavior-y:none;font-family:'Nunito',sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1,"cv11" 1}
/* Subtle noise texture on body — anti-flat */
body{background-image:url("data:image/svg+xml;utf8,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3CfeComponentTransfer%3E%3CfeFuncA type='linear' slope='0.04'/%3E%3C/feComponentTransfer%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"),var(--bg);background-attachment:scroll,scroll;background-size:200px 200px,auto}
/* Numbers always tabular + Geist Mono for finance precision */
.t-num,.streak-num,.hero-num,.mc .mv,input[type="number"],.iv,.t-hero{font-variant-numeric:tabular-nums lining-nums;font-family:'Geist Mono','SF Mono',ui-monospace,monospace;letter-spacing:-.02em}
/* Hero number bigger letter-spacing tightening */
.hero-num{letter-spacing:-.04em}
#app{max-width:430px;margin:0 auto;min-height:100vh;min-height:-webkit-fill-available;display:flex;flex-direction:column;background:var(--bg)}
@supports(height:100dvh){#app{min-height:100dvh}}
.hdr{display:none;height:0;flex-shrink:0;z-index:10}
.hdr-t{font-size:17px;font-weight:900;color:var(--txt)}.hdr-s{font-size:10px;color:var(--sub);font-weight:700;margin-top:1px}
.hdr-icon{background:var(--p-l);border:none;border-radius:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.pages{flex:1}
/* Scroll-lock: freeze the document behind an open modal WITHOUT touching pointer-events.
   top is set inline by JS (lockScroll) to -scrollY so position is preserved and restored. */
body.modal-open{position:fixed;left:0;right:0;width:100%;overflow:hidden}
/* Native document scroll: pages are normal-flow blocks, NEVER inner overflow scrollers.
   Do NOT add overflow-x here — overflow-x:hidden + overflow-y:visible computes overflow-y
   to auto, recreating the inner momentum scroller that caused the freeze bug. */
.page{display:none;padding:14px 14px 96px}
.page.active{display:block;animation:fadeUp .3s ease-out}
.page::-webkit-scrollbar{width:3px}.page::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
/* === PHANTOM GLASS FLOATING NAV === */
.bnav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:402px;height:72px;background:rgba(255,255,255,.7);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border-radius:26px;box-shadow:0 16px 40px rgba(26,19,37,.12),0 4px 12px rgba(139,92,246,.08),inset 1px 1px 0 rgba(255,255,255,.7);display:flex;padding:6px;z-index:50;border:1px solid rgba(255,255,255,.6)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:none;font-family:'Nunito',sans-serif;color:var(--sub);transition:all var(--dur-normal) var(--ease-bounce);padding:8px 0;position:relative;border-radius:20px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px}
.ni .ico{font-size:22px;line-height:1;transition:transform var(--dur-normal) var(--ease-bounce)}
.ni .lbl{font-size:10px;font-weight:900;letter-spacing:.4px;transition:opacity var(--dur-fast)}
.ni.on{background:var(--grad-purple);color:#fff;box-shadow:0 6px 16px rgba(139,92,246,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.ni.on .ico{transform:scale(1.1) translateY(-1px)}
.ni:not(.on):active{background:var(--p-l);transform:scale(.92)}
.card{background:var(--clay-card);border-radius:22px;padding:18px;box-shadow:var(--clay-out);margin-bottom:14px;border:1px solid rgba(255,255,255,.9)}
.card-s{background:var(--clay-card);border-radius:18px;padding:14px;box-shadow:var(--clay-out-sm);border:1px solid rgba(255,255,255,.9)}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.mc{background:var(--clay-card);border-radius:20px;padding:16px;box-shadow:var(--clay-out-sm);border:1px solid rgba(255,255,255,.9);transition:transform var(--dur-fast) var(--ease-bounce)}
.mc:active{transform:translateY(2px) scale(.98)}
.mc .ml{font-size:10px;font-weight:900;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.mc .mv{font-size:22px;font-weight:900;color:var(--txt);font-feature-settings:"tnum" 1;line-height:1.1}.mc .ms{font-size:11px;color:var(--sub);margin-top:4px;font-weight:700}
.mc.vio{background:linear-gradient(140deg,#fff 0%,#EDE9FE 100%)}.mc.vio .mv{color:var(--p-darker)}
.mc.grn{background:linear-gradient(140deg,#fff 0%,#D1FAE5 100%)}.mc.grn .mv{color:var(--g-darker)}
.mc.org{background:linear-gradient(140deg,#fff 0%,#FED7AA 100%)}.mc.org .mv{color:var(--o-darker)}
.mc.red{background:linear-gradient(140deg,#fff 0%,#FECACA 100%)}.mc.red .mv{color:var(--r-darker)}
.mc.blu{background:linear-gradient(140deg,#fff 0%,#DBEAFE 100%)}.mc.blu .mv{color:var(--b-darker)}
.seg{display:flex;background:var(--clay-card);border-radius:14px;padding:3px;box-shadow:var(--clay-in);border:1px solid rgba(255,255,255,.7);gap:2px}
.seg button{flex:1;padding:10px 4px;border:none;border-radius:11px;font-size:11px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;background:transparent;color:var(--sub);transition:all .2s ease}
.seg button.on{background:var(--grad-purple);color:#fff;box-shadow:0 3px 8px rgba(124,58,237,.3)}
.seg-hint{font-size:10px;color:var(--sub);font-weight:700;margin-top:6px;min-height:14px;transition:opacity .15s}
.cf-strip{display:flex;align-items:stretch;background:var(--clay-card);border-radius:18px;padding:14px 0;box-shadow:var(--clay-out-sm);border:1px solid rgba(255,255,255,.9);margin-bottom:14px}
.cf-strip .cf-col{flex:1;text-align:center;padding:0 10px}
.cf-strip .cf-col+.cf-col{border-left:1.5px solid var(--bdr)}
.cf-strip .cf-lbl{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:var(--sub);margin-bottom:4px}
.cf-strip .cf-val{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;font-family:'Geist Mono','SF Mono',monospace;line-height:1.2}
.cf-strip .cf-sub{font-size:9px;color:var(--sub);font-weight:700;margin-top:3px;line-height:1.3}
.pinj-summary{border-radius:12px;padding:10px 14px;font-size:11px;font-weight:700;color:#0369A1;background:var(--b-l);display:none}
.pinj-summary.show{display:block}
.pinj-summary .ps-row{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.pinj-summary .ps-row+.ps-row{border-top:1px solid rgba(3,105,161,.1);margin-top:2px;padding-top:4px}
/* Financial statements (M5) */
.rep{background:var(--clay-card);border-radius:18px;padding:16px;box-shadow:var(--clay-out-sm);border:1px solid rgba(255,255,255,.9)}
.rep-t{font-size:15px;font-weight:900;text-align:center;letter-spacing:.3px}
.rep-s{font-size:10px;color:var(--sub);text-align:center;font-weight:700;margin-bottom:10px}
.rep-sec{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--p-deep);margin:12px 0 3px;border-bottom:1.5px solid var(--bdr);padding-bottom:3px}
.rep-r{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;font-size:12.5px;gap:10px}
.rep-r .rl{color:var(--txt);font-weight:700;min-width:0}
.rep-r .rv{font-variant-numeric:tabular-nums;font-family:'Geist Mono','SF Mono',monospace;font-weight:700;white-space:nowrap}
.rep-r.sub{border-top:1px solid var(--bdr);margin-top:2px;font-weight:900}.rep-r.sub .rv{font-weight:900}
.rep-r.tot{border-top:2px solid var(--txt);margin-top:4px;font-weight:900;font-size:13.5px}.rep-r.tot .rv{font-weight:900}
.rep-ok{text-align:center;font-size:10px;font-weight:800;margin-top:8px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.st{font-size:15px;font-weight:900;color:var(--txt)}
.sl{font-size:11px;color:var(--p-deep);font-weight:800;cursor:pointer;background:none;border:none;font-family:'Nunito',sans-serif}

/* === PHANTOM HERO BALANCE CARD — DRAMATIC === */
.hero-bal{position:relative;background:linear-gradient(135deg,#0F0524 0%,#1A1325 30%,#3B2169 60%,#7C3AED 100%);border-radius:28px;padding:26px 24px 20px;margin-bottom:16px;color:#fff;overflow:hidden;box-shadow:0 20px 60px rgba(124,58,237,.45),0 8px 16px rgba(15,5,36,.3)}
/* Animated glow orbs */
.hero-bal::before{content:'';position:absolute;top:-50%;right:-40%;width:360px;height:360px;background:radial-gradient(circle,rgba(236,72,153,.5),transparent 60%);pointer-events:none;animation:floatOrb 8s ease-in-out infinite}
.hero-bal::after{content:'';position:absolute;bottom:-60%;left:-30%;width:320px;height:320px;background:radial-gradient(circle,rgba(34,211,238,.35),transparent 60%);pointer-events:none;animation:floatOrb 10s ease-in-out infinite reverse}
@keyframes floatOrb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-20px) scale(1.1)}}
.hero-bal>*{position:relative;z-index:1}
/* Sparkle stars decoration */
.hero-stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 70% 60%,rgba(255,255,255,.5),transparent),radial-gradient(2px 2px at 40% 80%,rgba(255,255,255,.4),transparent),radial-gradient(1px 1px at 85% 25%,rgba(255,255,255,.6),transparent),radial-gradient(1.5px 1.5px at 15% 65%,rgba(255,255,255,.4),transparent);pointer-events:none;opacity:.8}
.hero-label{font-size:10px;font-weight:900;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.hero-label::before{content:'✦';color:#EC4899}
.hero-num{font-size:46px;font-weight:900;line-height:1;letter-spacing:-2px;margin-bottom:14px;font-feature-settings:"tnum" 1;background:linear-gradient(180deg,#fff 0%,rgba(255,255,255,.85) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:0 4px 20px rgba(0,0,0,.3)}
.hero-num .hero-curr{font-size:18px;font-weight:800;opacity:.6;margin-right:6px;vertical-align:top;line-height:2.2;background:none;-webkit-text-fill-color:rgba(255,255,255,.7)}
.hero-delta{display:inline-flex;align-items:center;gap:7px;background:rgba(34,197,94,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:8px 14px;border-radius:14px;font-size:12px;font-weight:900;border:1.5px solid rgba(134,239,172,.3);margin-bottom:14px;color:#86EFAC;box-shadow:0 4px 16px rgba(34,197,94,.2)}
.hero-delta.down{background:rgba(239,68,68,.18);border-color:rgba(252,165,165,.3);color:#FCA5A5;box-shadow:0 4px 16px rgba(239,68,68,.2)}
.aum-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.aum-pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.75);border-radius:10px;padding:6px 11px;font-size:10px;font-weight:900;letter-spacing:.4px;cursor:pointer;font-family:Nunito,sans-serif;transition:all .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:30px}
.aum-pill.on{background:#fff;color:#3B2169;border-color:#fff;box-shadow:0 2px 10px rgba(255,255,255,.25)}
.aum-pill:not(.on):active{background:rgba(255,255,255,.22)}
.hero-pw{display:flex;background:rgba(0,0,0,.4);border-radius:20px;height:10px;overflow:hidden;margin-bottom:10px;border:1px solid rgba(255,255,255,.08)}
.hero-seg{height:100%;transition:width 1s cubic-bezier(.34,1.56,.64,1)}
.hero-seg--realized{background:linear-gradient(90deg,#86EFAC 0%,#22D3EE 60%,#EC4899 100%);box-shadow:0 0 20px rgba(134,239,172,.6),inset 0 1px 0 rgba(255,255,255,.3);position:relative;overflow:hidden}
.hero-seg--realized::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shimmer 2s infinite}
.hero-seg--scheduled{background:rgba(255,255,255,.22)}
.hero-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;color:rgba(255,255,255,.75)}
.hero-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.hero-dot--realized{background:#86EFAC;box-shadow:0 0 6px rgba(134,239,172,.7)}
.hero-dot--scheduled{background:rgba(255,255,255,.45)}
.hero-meta b{color:#fff;font-weight:900}

/* === ASYMMETRIC ACHIEVEMENT STRIP (no 3-column AI cliché) === */
/* Featured stat (large) + 2 smaller stacked stats */
.streak-strip{display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:auto auto;gap:10px;margin-bottom:20px}
.streak-card{position:relative;overflow:hidden;border-radius:22px;padding:14px 16px;transition:transform var(--dur-fast) var(--ease-bounce),box-shadow var(--dur-fast);cursor:pointer;border:1px solid rgba(255,255,255,.9);display:flex;flex-direction:column;justify-content:center}
.streak-card:active{transform:translateY(2px) scale(.97)}
/* Hero card (spans 2 rows) */
.streak-card.fire{grid-row:span 2;background:linear-gradient(140deg,#FFF7ED 0%,#FED7AA 100%);box-shadow:6px 6px 14px rgba(249,115,22,.18),-6px -6px 14px rgba(255,255,255,.95);min-height:124px}
.streak-card.fire:active{box-shadow:3px 3px 7px rgba(249,115,22,.15),-3px -3px 7px rgba(255,255,255,.9)}
.streak-card.fire .streak-emoji{font-size:34px;margin-bottom:6px}
.streak-card.fire .streak-num{font-size:30px;letter-spacing:-1.2px}
.streak-card.fire .streak-lbl{font-size:10px}
/* Smaller compact cards */
.streak-card.star{background:linear-gradient(140deg,#F5F3FF 0%,#DDD6FE 100%);box-shadow:5px 5px 12px rgba(139,92,246,.18),-5px -5px 12px rgba(255,255,255,.95);min-height:54px;flex-direction:row;align-items:center;gap:10px;padding:10px 14px}
.streak-card.star:active{box-shadow:2px 2px 6px rgba(139,92,246,.15),-2px -2px 6px rgba(255,255,255,.9)}
.streak-card.star .streak-emoji{font-size:22px;margin-bottom:0}
.streak-card.star .streak-num{font-size:16px;line-height:1;margin-bottom:2px}
.streak-card.star .streak-lbl{font-size:8.5px;letter-spacing:.5px}
.streak-card.target{background:linear-gradient(140deg,#F0FDF4 0%,#A7F3D0 100%);box-shadow:5px 5px 12px rgba(22,163,74,.18),-5px -5px 12px rgba(255,255,255,.95);min-height:54px;flex-direction:row;align-items:center;gap:10px;padding:10px 14px}
.streak-card.target:active{box-shadow:2px 2px 6px rgba(22,163,74,.15),-2px -2px 6px rgba(255,255,255,.9)}
.streak-card.target .streak-emoji{font-size:22px;margin-bottom:0}
.streak-card.target .streak-num{font-size:16px;line-height:1;margin-bottom:2px}
.streak-card.target .streak-lbl{font-size:8.5px;letter-spacing:.5px}
/* Wrap text content for compact cards */
.streak-card.star>div.sc-text,.streak-card.target>div.sc-text{flex:1}
.streak-emoji{line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
.streak-num{font-weight:900;color:var(--txt);font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums;line-height:1.1}
.streak-lbl{font-weight:900;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;line-height:1.2}
/* === CLAYMORPHISM PROJECT CARDS (Duolingo signature) === */
.pc{position:relative;background:var(--clay-card);border-radius:24px;padding:18px;margin-bottom:18px;cursor:pointer;transition:transform var(--dur-fast) var(--ease-bounce),box-shadow var(--dur-fast) var(--ease-smooth);animation:cardIn .4s var(--ease-bounce) both;will-change:transform;border:1px solid rgba(255,255,255,.9);box-shadow:var(--clay-out)}
.pc:active{transform:translateY(2px) scale(.99);box-shadow:var(--clay-out-sm)}

<script>
// ── STATE ─────────────────────────────────────────────────────────────
let S = {
  projects: [],
  fund: { kurAmount:500, angsuran:9.6665, bufferMonths:6, living:25,
          startDate: new Date().toISOString().split('T')[0] },
  external: []
};
let CP='b', MT='aktif', eP=null, eE=null, extTab='pinjaman';
let charts={};

let _pin='', _saving=false, _saveTimer=null;
const DOC_ID='main_data';

function load(){
  try{const s=localStorage.getItem('dt_v3');if(s)S={...S,...JSON.parse(s)};}catch(e){}
  migrateSchema();
}

// Schema migration — runs on every load to ensure backwards-compat
function migrateSchema(){
  // 1. Investor isOwner flag — default to false for existing entities
  (S.external||[]).forEach(e=>{
    if(e.tipe==='investor' && e.isOwner===undefined) e.isOwner=false;
    if(e.tipe==='pinjaman' && !e.assignedOwners) e.assignedOwners=[];
  });
  // 2. Fase 2 — Treasury & Accounting ledger foundation (additive, idempotent).
  //    Physical pockets must mirror Bank Jago: Utama=bayar (transfer conduit,
  //    transient), Gde/RRPR=nabung (savings, no direct transfer). Liquidity
  //    priority: Gde first, RRPR last resort.
  // 5 kantong (additive + idempoten). role: hub=bayar/transient, serang=Gde,
  // bertahan=RRPR benteng, amunisi=investor belum dialokasikan, sinking=investor
  // jatuh tempo (dikunci, tidak boleh dipakai proyek). prioritas = urutan pakai
  // likuiditas (Gde dulu, investor, RRPR terakhir). Deploy priority beda: investor dulu.
  const defPockets=[
    {code:'1000', nama:'Utama',                  tipe:'bayar',  role:'hub',      prioritas:0},
    {code:'1010', nama:'Gde',                    tipe:'nabung', role:'serang',   prioritas:1},
    {code:'1030', nama:'Investor Belum Dialokasikan', tipe:'nabung', role:'amunisi', prioritas:2},
    {code:'1020', nama:'RRPR',                   tipe:'nabung', role:'bertahan', prioritas:3},
    {code:'1040', nama:'Investor Jatuh Tempo',   tipe:'nabung', role:'sinking',  prioritas:9, locked:true},
  ];
  if(!Array.isArray(S.pockets)) S.pockets=[];
  defPockets.forEach(dp=>{
    const ex=S.pockets.find(p=>p.code===dp.code);
    if(!ex){ S.pockets.push({...dp}); return; }
    // keep the 5 system-default pockets canonical (name/tipe/role/prioritas/locked)
    ex.nama=dp.nama; ex.tipe=dp.tipe; ex.role=dp.role; ex.prioritas=dp.prioritas;
    if(dp.locked) ex.locked=true;
  });
  if(!Array.isArray(S.ledger)) S.ledger=[];
  if(!Array.isArray(S.investorContracts)) S.investorContracts=[];
  if(!S.orgConfig) S.orgConfig={ ownerSplitMode:'prorata', investorRateDefault:2 };
}
function setSync(state, ts){

  else if(state==='synced'){
    const t=ts?new Date(ts):new Date();
    const fmt=t.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});

async function loadFromFirestore(){
  setSync('syncing');
  try{
    const snap=await db.collection('danatrack').doc(DOC_ID).get();
    if(snap.exists){
      const d=snap.data();
      const cloudProjects=(d.state&&d.state.projects)?d.state.projects.length:0;
      const localProjects=(S.projects||[]).length;
      // Data-loss guard: if cloud has FEWER projects than what we already have
      // locally, the cloud copy is likely corrupted/clobbered — do NOT overwrite.
      // Snapshot local first, then keep local so the real data survives.
      if(localProjects>0 && cloudProjects<localProjects){
        try{localStorage.setItem('dt_v3_backup_'+Date.now(),JSON.stringify(S));}catch(e){}
        console.warn('[guard] cloud has fewer projects ('+cloudProjects+') than local ('+localProjects+') — keeping local, cloud NOT applied.');
        setSync('error');
        return;
      }
      // Always snapshot the pre-merge local data before overwriting (recovery safety)
      try{localStorage.setItem('dt_v3_prev',localStorage.getItem('dt_v3')||'');}catch(e){}
      S={...S,...d.state};
      localStorage.setItem('dt_v3',JSON.stringify(S));
      setSync('synced',d.updatedAt);
    } else setSync('synced');
  }catch(e){console.warn('Firestore load:',e);setSync('error');}
}
function save(){
  try{localStorage.setItem('dt_v3',JSON.stringify(S));}catch(e){}
  if(!_adminUnlocked)return;
  if(_saveTimer)clearTimeout(_saveTimer);
  _saveTimer=setTimeout(saveToFirestore,800);
}
// Guard: never let a dev/preview origin (localhost / 127.* / file) write to
// the PRODUCTION Firestore doc. Prevents test data from clobbering real data.
function isProdOrigin(){
  const h=location.hostname;
  return h.endsWith('github.io')||h.endsWith('datanetworkdigital.com');
}
async function saveToFirestore(){
  if(!_adminUnlocked||_saving)return;
  if(!isProdOrigin()){
    console.warn('[guard] cloud write blocked on non-prod origin:',location.hostname);
    setSync('synced'); // pretend-OK locally; localStorage still holds the data
    return;
  }
  _saving=true;
  setSync('syncing');
  try{
    const ts=new Date().toISOString();
    await db.collection('danatrack').doc(DOC_ID).set({state:JSON.parse(JSON.stringify(S)),updatedAt:ts},{merge:true});
    setSync('synced',ts);
  }catch(e){console.warn('Firestore save:',e);setSync('error');}
  _saving=false;
}

// ── LEDGER ENGINE (Fase 2 — double-entry) ─────────────────────────────
// Fixed chart of accounts (non-pocket). Pockets (asset accounts 10xx) live in
// S.pockets so the user can add savings pockets. Every rupiah movement is a
// balanced journal entry in S.ledger; ALL balances/reports derive from it.
const COA_FIXED = [
  {code:'1100', name:'Dana di Proyek',                type:'aset',       normal:'D'},
  {code:'2000', name:'Dana Investor (Pokok)',         type:'liabilitas', normal:'K'},
  {code:'2010', name:'Bagi Hasil Belum Dibayar',      type:'liabilitas', normal:'K'},
  {code:'2100', name:'Kewajiban Pembiayaan',          type:'liabilitas', normal:'K'},
  {code:'3000', name:'Modal Gde',                     type:'ekuitas',    normal:'K'},
  {code:'3010', name:'Modal RRPR',                    type:'ekuitas',    normal:'K'},
  {code:'3900', name:'Laba Ditahan',                  type:'ekuitas',    normal:'K'},
  {code:'3990', name:'Penyesuaian Rekonsiliasi',      type:'ekuitas',    normal:'K'},
  {code:'4000', name:'Pendapatan Imbal Hasil Proyek', type:'pendapatan', normal:'K'},
  {code:'5000', name:'Beban Bagi Hasil Investor',     type:'beban',      normal:'D'},
  {code:'5010', name:'Beban Bunga Pinjaman',          type:'beban',      normal:'D'},
  {code:'5020', name:'Beban Fee Admin',               type:'beban',      normal:'D'},
  {code:'5030', name:'Beban Operasional',             type:'beban',      normal:'D'},
];
// Resolve account metadata by code (CoA first, then pockets = asset/D-normal).
function acct(code){
  const f=COA_FIXED.find(a=>a.code===code); if(f) return f;
  const p=(S.pockets||[]).find(x=>x.code===code);
  if(p) return {code:p.code, name:p.nama, type:'aset', normal:'D', pocket:true, pocketTipe:p.tipe};
  return {code, name:code, type:'aset', normal:'D'};
}
function allAccounts(){
  const map={};
  (S.pockets||[]).forEach(p=>{ map[p.code]=acct(p.code); });
  COA_FIXED.forEach(a=>{ map[a.code]=a; });
  return Object.values(map).sort((a,b)=>a.code<b.code?-1:1);
}
// Post a balanced journal entry. lines: [{account, debit, credit}] in jt.
function ledgerPost(tanggal, memo, lines, ref){
  const cl=lines.filter(l=>(+l.debit||0)!==0||(+l.credit||0)!==0)
    .map(l=>({account:l.account, debit:Math.round((+l.debit||0)*1e4)/1e4, credit:Math.round((+l.credit||0)*1e4)/1e4}));
  const d=cl.reduce((s,l)=>s+l.debit,0), k=cl.reduce((s,l)=>s+l.credit,0);
  if(Math.abs(d-k)>0.005){ console.error('[ledger] UNBALANCED', memo, {d,k}, cl); throw new Error('Jurnal tidak balance: '+memo); }
  const entry={ id:uid(), tanggal, memo, ref:ref||null, lines:cl };
  if(!Array.isArray(S.ledger)) S.ledger=[];
  S.ledger.push(entry);
  return entry;
}
// Convenience: simple 2-line Dr/Cr entry.
function ledgerPost2(tanggal, memo, drCode, krCode, amount, ref){
  const a=Math.round((+amount||0)*1e4)/1e4;
  return ledgerPost(tanggal, memo, [{account:drCode,debit:a,credit:0},{account:krCode,debit:0,credit:a}], ref);
}
// Signed balance of an account across the whole ledger (respecting normal side).
function acctBalance(code){
  let d=0,k=0;
  (S.ledger||[]).forEach(e=>e.lines.forEach(l=>{ if(l.account===code){ d+=l.debit; k+=l.credit; } }));
  return acct(code).normal==='D' ? d-k : k-d;
}
function pocketBalance(code){ return acctBalance(code); }
// Trial balance: every account with a nonzero balance, split to debit/credit column.
function trialBalance(){
  return allAccounts().map(a=>{
    const bal=acctBalance(a.code);
    return { code:a.code, name:a.name, type:a.type, normal:a.normal,
             debit: a.normal==='D'? Math.max(bal,0) : Math.max(-bal,0),
             credit:a.normal==='K'? Math.max(bal,0) : Math.max(-bal,0),
             balance:bal };
  }).filter(r=>Math.abs(r.balance)>0.005);
}
// Owner pocket -> equity account (for capital injections). RRPR pocket = 3010, else Gde.
function ownerModalAccount(pocketCode){ return pocketCode==='1020' ? '3010' : '3000'; }

// High-level transaction helpers (each = one balanced journal entry). Values in jt.
function txSetorModal(tanggal, pocketCode, jumlah, memo){
  return ledgerPost2(tanggal, memo||('Setor modal ke '+acct(pocketCode).name), pocketCode, ownerModalAccount(pocketCode), jumlah, 'setor-modal');

function txTransfer(tanggal, dariCode, keCode, jumlah, memo){
  return ledgerPost2(tanggal, memo||('Transfer '+acct(dariCode).name+' → '+acct(keCode).name), keCode, dariCode, jumlah, 'transfer');

const INV_STRUKTUR={
  bulanan:{label:'Bagi hasil bulanan, pokok di akhir', hint:'Investor terima bagi hasil tiap bulan; pokok kembali saat jatuh tempo. Paling stabil untuk likuiditas.'},
  akhir:  {label:'Bagi hasil + pokok di akhir',        hint:'Semua (bagi hasil terkumpul + pokok) dibayar sekaligus di akhir tenor.'},
  cicil:  {label:'Pokok + bagi hasil dicicil bulanan', hint:'Pokok dicicil rata tiap bulan; bagi hasil dihitung dari sisa pokok.'},
};
function invContracts(){ if(!Array.isArray(S.investorContracts)) S.investorContracts=[]; return S.investorContracts; }
function contractSchedule(c){
  const pokok=parseFloat(c.pokok||0), rate=parseFloat(c.ratePct||2)/100, tenor=parseInt(c.tenorBulan||0);
  const bh=pokok*rate, r4=x=>Math.round(x*1e4)/1e4, sched=[];
  if(c.struktur==='akhir'){
    sched.push({tanggal:am(c.tanggalMulai,tenor), tipe:'bagihasil', jumlah:r4(bh*tenor), status:'pending'});
    sched.push({tanggal:am(c.tanggalMulai,tenor), tipe:'pokok', jumlah:r4(pokok), status:'pending'});
  } else if(c.struktur==='cicil'){
    const pb=pokok/tenor;
    for(let i=1;i<=tenor;i++){
      const sisa=pokok-pb*(i-1);
      sched.push({tanggal:am(c.tanggalMulai,i), tipe:'bagihasil', jumlah:r4(sisa*rate), status:'pending'});
      sched.push({tanggal:am(c.tanggalMulai,i), tipe:'pokok', jumlah:r4(pb), status:'pending'});
    }
  } else { // bulanan
    for(let i=1;i<=tenor;i++) sched.push({tanggal:am(c.tanggalMulai,i), tipe:'bagihasil', jumlah:r4(bh), status:'pending'});
    sched.push({tanggal:am(c.tanggalMulai,tenor), tipe:'pokok', jumlah:r4(pokok), status:'pending'});
  }
  return sched;
}
function invNextDue(c){ return (c.schedule||[]).filter(s=>s.status==='pending').sort((a,b)=>a.tanggal<b.tanggal?-1:1)[0]||null; }
function invTotalPokok(){ return invContracts().filter(c=>c.status!=='selesai').reduce((s,c)=>s+parseFloat(c.pokok||0),0); }
function rKeuInvestor(){
  const cs=invContracts();
  const aktif=cs.filter(c=>c.status!=='selesai');
  const totalPokok=invTotalPokok();
  const bhBulan=aktif.reduce((s,c)=>s+parseFloat(c.pokok||0)*parseFloat(c.ratePct||2)/100,0);
  let h=`<div class="cf-strip">
    <div class="cf-col"><div class="cf-lbl">Total Pokok</div><div class="cf-val" style="color:var(--p-deep)">${fj(totalPokok)}</div></div>
    <div class="cf-col"><div class="cf-lbl">Bagi Hasil/bln</div><div class="cf-val" style="color:var(--r)">${fj(bhBulan)}</div></div>
    <div class="cf-col"><div class="cf-lbl">Kontrak Aktif</div><div class="cf-val">${aktif.length}</div></div>
  </div>
  <button class="btn pr fw" onclick="invModal('add')" style="margin-bottom:12px">➕ Tambah Kontrak Investor</button>`;
  if(!cs.length){ h+=`<div class="es"><div class="ei">🤝</div><div class="et">Belum ada kontrak</div><div class="esb">Tambah kontrak investor, atau "Isi Data Contoh" di tab Kantong.</div></div>`; return h; }
  cs.slice().sort((a,b)=>(a.status==='selesai'?1:0)-(b.status==='selesai'?1:0)).forEach(c=>{
    const nd=invNextDue(c), st=INV_STRUKTUR[c.struktur]||INV_STRUKTUR.bulanan, done=c.status==='selesai';
    h+=`<div class="card-s" style="margin-bottom:10px;${done?'opacity:.6':''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="min-width:0"><div style="font-size:14px;font-weight:900">${c.nama}</div>
          <div style="font-size:10px;color:var(--sub);font-weight:700">${fj(c.pokok)} · ${c.ratePct||2}%/bln · ${c.tenorBulan} bln</div></div>
        <div style="font-size:9px;font-weight:900;color:var(--p-deep);text-transform:uppercase;text-align:right;flex-shrink:0">${done?'✅ Selesai':(c.struktur==='akhir'?'Di akhir':c.struktur==='cicil'?'Dicicil':'Bulanan')}</div>
      </div>
      ${nd?`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr);font-size:11px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span>Berikutnya: ${nd.tipe==='pokok'?'💰 Pokok':'📈 Bagi hasil'} <b>${fj(nd.jumlah)}</b><br><span style="font-size:10px;color:${gc(du(nd.tanggal))}">${fd(nd.tanggal)} · ${gl(du(nd.tanggal))}</span></span>
        <button class="btn pr" onclick="invBayar('${c.id}')" style="font-size:11px;padding:7px 14px;flex-shrink:0">Bayar</button></div>`:''}
      <div style="margin-top:8px;font-size:11px"><button class="sl" onclick="invModal('edit','${c.id}')">✏️ Edit</button> &nbsp;·&nbsp; <button class="sl" onclick="invDetail('${c.id}')" style="color:var(--sub)">📅 Jadwal lengkap</button></div>
    </div>`;
  });
  return h;
}
function invHint(){ const v=document.getElementById('ic-struktur').value, el=document.getElementById('ic-hint'); if(el) el.textContent=(INV_STRUKTUR[v]||INV_STRUKTUR.bulanan).hint; }
function invModal(mode, id){
  const c=mode==='edit'?invContracts().find(x=>x.id===id):null;
  document.getElementById('mo-keu-t').textContent=(mode==='edit'?'✏️ Edit':'➕ Tambah')+' Kontrak Investor';
  const ds=new Date().toISOString().split('T')[0], stru=(c&&c.struktur)||'bulanan';
  const opt=(v)=>`<option value="${v}" ${stru===v?'selected':''}>${INV_STRUKTUR[v].label}</option>`;
  document.getElementById('mo-keu-b').innerHTML=`
    <div class="fg"><label class="fl">Nama Investor</label><input class="fi" id="ic-nama" value="${c?c.nama:''}" placeholder="Nama investor"></div>
    <div class="fr">
      <div class="fg"><label class="fl">Pokok (jt)</label><input class="fi" id="ic-pokok" type="number" step="0.0001" value="${c?c.pokok:''}" placeholder="0"></div>
      <div class="fg"><label class="fl">Bagi Hasil (%/bln)</label><input class="fi" id="ic-rate" type="number" step="0.01" value="${c?(c.ratePct??2):2}"></div>
    </div>
    <div class="fr">
      <div class="fg"><label class="fl">Tanggal Mulai</label><input class="fi" id="ic-mulai" type="date" value="${c?c.tanggalMulai:ds}"></div>
      <div class="fg"><label class="fl">Tenor (bln)</label><input class="fi" id="ic-tenor" type="number" value="${c?c.tenorBulan:12}"></div>
    </div>
    <div class="fg"><label class="fl">Struktur Bagi Hasil</label>
      <select class="fi" id="ic-struktur" onchange="invHint()">${opt('bulanan')}${opt('akhir')}${opt('cicil')}</select>
      <div class="fh" id="ic-hint">${(INV_STRUKTUR[stru]||INV_STRUKTUR.bulanan).hint}</div>
    </div>
    <button class="btn pr fw" onclick="invSave('${mode}','${id||''}')" style="margin-top:8px">${mode==='edit'?'Simpan Perubahan':'Buat Kontrak + Terima Pokok'}</button>
    ${mode==='edit'?`<button class="btn ou fw" onclick="invDelete('${id}')" style="margin-top:8px;color:var(--r)">🗑️ Hapus Kontrak</button>`:''}`;
  om('mo-keu');
}
function invSave(mode, id){
  const nama=document.getElementById('ic-nama').value.trim();
  const pokok=parseFloat(document.getElementById('ic-pokok').value||0);
  const rate=parseFloat(document.getElementById('ic-rate').value||2);
  const mulai=document.getElementById('ic-mulai').value;
  const tenor=parseInt(document.getElementById('ic-tenor').value||0);
  const struktur=document.getElementById('ic-struktur').value;
  if(!nama){ toast('❌ Nama wajib'); return; }
  if(!(pokok>0)){ toast('❌ Pokok harus > 0'); return; }
  if(!(tenor>0)){ toast('❌ Tenor harus > 0'); return; }
  if(mode==='edit'){
    const c=invContracts().find(x=>x.id===id); if(!c) return;
    const anyPaid=(c.schedule||[]).some(s=>s.status==='paid');
    Object.assign(c,{nama,pokok,ratePct:rate,tanggalMulai:mulai,tenorBulan:tenor,struktur});
    if(!anyPaid) c.schedule=contractSchedule(c);
    save(); cm('mo-keu'); rKeu(); toast(anyPaid?'✅ Diperbarui (jadwal terkunci karena sudah ada pembayaran)':'✅ Kontrak diperbarui');
  } else {
    const c={id:uid(),nama,pokok,ratePct:rate,tanggalMulai:mulai,tenorBulan:tenor,struktur,status:'aktif'};
    c.schedule=contractSchedule(c);
    invContracts().push(c);
    ledgerPost2(mulai,'Terima dana investor: '+nama,'1030','2000',pokok,'inv-masuk'); // cash into amunisi, liability up
    save(); cm('mo-keu'); rKeu(); toast('✅ Kontrak dibuat + pokok diterima');
  }
}
function invBayar(id){
  const c=invContracts().find(x=>x.id===id); if(!c) return;
  const nd=invNextDue(c); if(!nd){ toast('Semua sudah dibayar'); return; }
  document.getElementById('mo-keu-t').textContent='💸 Bayar '+(nd.tipe==='pokok'?'Pokok':'Bagi Hasil');
  document.getElementById('mo-keu-b').innerHTML=`
    <div class="fc-note" style="margin-bottom:12px">${c.nama} · ${nd.tipe==='pokok'?'Pengembalian pokok':'Bagi hasil'} <b>${fj(nd.jumlah)}</b> · jatuh tempo ${fd(nd.tanggal)}</div>
    <div class="fg"><label class="fl">Bayar dari kantong</label><select class="fi" id="k-src">${pocketOptions('1040')}</select></div>
    <div class="fg"><label class="fl">Tanggal bayar</label><input class="fi" id="k-date" type="date" value="${new Date().toISOString().split('T')[0]}"></div>
    <button class="btn pr fw" onclick="invConfirmBayar('${id}')" style="margin-top:8px">Konfirmasi Bayar ${fj(nd.jumlah)}</button>`;
  om('mo-keu');
}
function invConfirmBayar(id){
  const c=invContracts().find(x=>x.id===id); if(!c) return;
  const nd=invNextDue(c); if(!nd) return;
  const src=document.getElementById('k-src').value, date=document.getElementById('k-date').value;
  if(nd.tipe==='pokok') txKembalikanPokokInvestor(date, nd.jumlah, src, 'Kembalikan pokok: '+c.nama);
  else ledgerPost(date,'Bagi hasil: '+c.nama,[{account:'5000',debit:nd.jumlah,credit:0},{account:src,debit:0,credit:nd.jumlah}],'bayar-bh');
  nd.status='paid'; nd.paidDate=date; nd.paidFrom=src;
  if(!(c.schedule||[]).some(s=>s.status==='pending')) c.status='selesai';
  save(); cm('mo-keu'); rKeu(); toast('✅ Pembayaran dicatat');
}
function invDetail(id){
  const c=invContracts().find(x=>x.id===id); if(!c) return;
  document.getElementById('mo-keu-t').textContent='📅 Jadwal · '+c.nama;
  let b=`<div class="fc-note" style="margin-bottom:10px">${fj(c.pokok)} · ${c.ratePct}%/bln · ${c.tenorBulan} bln · ${(INV_STRUKTUR[c.struktur]||INV_STRUKTUR.bulanan).label}</div>`;
  (c.schedule||[]).forEach(s=>{
    b+=`<div class="ir"><div class="ik">${s.tipe==='pokok'?'💰 Pokok':'📈 Bagi hasil'} · ${fd(s.tanggal)}</div><div class="iv" style="color:${s.status==='paid'?'#0B8F46':'var(--txt)'}">${fj(s.jumlah)} ${s.status==='paid'?'✅':''}</div></div>`;
  });
  document.getElementById('mo-keu-b').innerHTML=b;
  om('mo-keu');
}
function invDelete(id){
  const c=invContracts().find(x=>x.id===id); if(!c) return;
  if((c.schedule||[]).some(s=>s.status==='paid')){ toast('❌ Sudah ada pembayaran. Tidak bisa dihapus.'); return; }
  if(!confirm('Hapus kontrak "'+c.nama+'"? Jurnal terima pokok akan dibalik agar buku besar tetap konsisten.')) return;
  ledgerPost2(new Date().toISOString().split('T')[0],'Batal kontrak investor: '+c.nama,'2000','1030',parseFloat(c.pokok||0),'inv-batal');
  S.investorContracts=invContracts().filter(x=>x.id!==id);
  save(); cm('mo-keu'); rKeu(); toast('🗑️ Kontrak dihapus + pokok dibalik');
}

// ── LAPORAN KEUANGAN (M5: 5 laporan format perusahaan terbuka) ────────
let lapReport='laba-rugi';
function swLap(r){ lapReport=r; rKeu(); }
function repR(label, amount, cls){ return `<div class="rep-r ${cls||''}"><span class="rl">${label}</span><span class="rv">${fj(amount)}</span></div>`; }
function repToday(){ return fd(new Date().toISOString().split('T')[0]); }
function rKeuLaporan(){
  const reports=[['laba-rugi','Laba Rugi'],['neraca','Neraca'],['arus-kas','Arus Kas'],['neraca-saldo','Neraca Saldo'],['jurnal','Jurnal']];
  let h=`<div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;-webkit-overflow-scrolling:touch">`;
  reports.forEach(([k,l])=>h+=`<button class="tab ${lapReport===k?'on':''}" onclick="swLap('${k}')" style="flex:0 0 auto;padding:8px 14px">${l}</button>`);
  h+=`</div>`;
  if(!(S.ledger||[]).length) return h+`<div class="es"><div class="ei">📊</div><div class="et">Belum ada data</div><div class="esb">Isi transaksi dulu (tab Kantong → Isi Data Contoh).</div></div>`;
  if(lapReport==='laba-rugi') h+=repLabaRugi();
  else if(lapReport==='neraca') h+=repNeraca();
  else if(lapReport==='arus-kas') h+=repArusKas();
  else if(lapReport==='neraca-saldo') h+=repNeracaSaldo();
  else h+=repJurnal();
  return h;
}
function labaBerjalan(){
  return allAccounts().filter(a=>a.type==='pendapatan').reduce((s,a)=>s+acctBalance(a.code),0)
       - allAccounts().filter(a=>a.type==='beban').reduce((s,a)=>s+acctBalance(a.code),0);
}
function repLabaRugi(){
  const rev=allAccounts().filter(a=>a.type==='pendapatan'), exp=allAccounts().filter(a=>a.type==='beban');
  let totRev=0, totExp=0;
  let h=`<div class="rep"><div class="rep-t">LAPORAN LABA RUGI</div><div class="rep-s">Roxanne Capital · s/d ${repToday()}</div>`;
  h+=`<div class="rep-sec">Pendapatan</div>`;
  let any=false; rev.forEach(a=>{const b=acctBalance(a.code); if(Math.abs(b)>0.005){totRev+=b; any=true; h+=repR(a.name,b);}}); if(!any) h+=repR('(belum ada)',0);
  h+=repR('Total Pendapatan',totRev,'sub');
  h+=`<div class="rep-sec">Beban</div>`;
  any=false; exp.forEach(a=>{const b=acctBalance(a.code); if(Math.abs(b)>0.005){totExp+=b; any=true; h+=repR(a.name,b);}}); if(!any) h+=repR('(belum ada)',0);
  h+=repR('Total Beban',totExp,'sub');
  h+=repR('LABA BERSIH',totRev-totExp,'tot');
  return h+`</div>`;
}
function repNeraca(){
  const aset=allAccounts().filter(a=>a.type==='aset'), liab=allAccounts().filter(a=>a.type==='liabilitas'), eku=allAccounts().filter(a=>a.type==='ekuitas');
  let totAset=0,totLiab=0,totEku=0;
  let h=`<div class="rep"><div class="rep-t">NERACA</div><div class="rep-s">Roxanne Capital · per ${repToday()}</div>`;
  h+=`<div class="rep-sec">Aset</div>`;
  aset.forEach(a=>{const b=acctBalance(a.code); if(Math.abs(b)>0.005){totAset+=b; h+=repR(a.name,b);}});
  h+=repR('Total Aset',totAset,'tot');
  h+=`<div class="rep-sec">Liabilitas</div>`;
  liab.forEach(a=>{const b=acctBalance(a.code); if(Math.abs(b)>0.005){totLiab+=b; h+=repR(a.name,b);}});
  if(!totLiab) h+=repR('(belum ada)',0);
  h+=repR('Total Liabilitas',totLiab,'sub');
  h+=`<div class="rep-sec">Ekuitas</div>`;
  eku.forEach(a=>{const b=acctBalance(a.code); if(Math.abs(b)>0.005){totEku+=b; h+=repR(a.name,b);}});
  const lb=labaBerjalan(); if(Math.abs(lb)>0.005){ totEku+=lb; h+=repR('Laba Berjalan',lb);}
  h+=repR('Total Ekuitas',totEku,'sub');
  h+=repR('Liabilitas + Ekuitas',totLiab+totEku,'tot');
  const bal=Math.abs(totAset-(totLiab+totEku))<0.005;
  h+=`<div class="rep-ok" style="color:${bal?'#0B8F46':'var(--r)'}">${bal?'✓ Neraca seimbang (Aset = Liabilitas + Ekuitas)':'⚠ Tidak seimbang'}</div>`;
  return h+`</div>`;
}
function catArusKas(code){
  if(code[0]==='4'||code[0]==='5') return 'operasi';
  if(code==='1100') return 'investasi';
  if(code[0]==='2'||code[0]==='3') return 'pendanaan';
  return null; // pocket-to-pocket transfer
}
function repArusKas(){
  const pockets=new Set((S.pockets||[]).map(p=>p.code));
  const items={operasi:{},investasi:{},pendanaan:{}}, tot={operasi:0,investasi:0,pendanaan:0};
  (S.ledger||[]).forEach(e=>{
    const cashLines=e.lines.filter(l=>pockets.has(l.account)), nonCash=e.lines.filter(l=>!pockets.has(l.account));
    if(!cashLines.length||!nonCash.length) return;
    const netCash=cashLines.reduce((s,l)=>s+l.debit-l.credit,0);
    const cp=nonCash.slice().sort((a,b)=>(b.debit+b.credit)-(a.debit+a.credit))[0];
    const cat=catArusKas(cp.account); if(!cat) return;
    const nm=acct(cp.account).name;
    items[cat][nm]=(items[cat][nm]||0)+netCash; tot[cat]+=netCash;
  });
  const sec=(title,key)=>{let s=`<div class="rep-sec">Arus Kas ${title}</div>`; const ks=Object.keys(items[key]); if(!ks.length) s+=repR('(belum ada)',0); ks.forEach(k=>s+=repR(k,items[key][k])); s+=repR('Subtotal '+title,tot[key],'sub'); return s;};
  let h=`<div class="rep"><div class="rep-t">LAPORAN ARUS KAS</div><div class="rep-s">Roxanne Capital · s/d ${repToday()}</div>`;
  h+=sec('Operasi','operasi')+sec('Investasi','investasi')+sec('Pendanaan','pendanaan');
  h+=repR('KENAIKAN KAS BERSIH',tot.operasi+tot.investasi+tot.pendanaan,'tot');
  h+=repR('Kas akhir (semua kantong)',totalLikuid(),'sub');
  return h+`</div>`;
}
function repNeracaSaldo(){
  const tb=trialBalance(); let totD=0,totK=0;
  const cell=v=>`<span class="rv" style="width:70px;text-align:right;font-size:11px">${v>0.005?fjPlain(v):'-'}</span>`;
  let h=`<div class="rep"><div class="rep-t">NERACA SALDO</div><div class="rep-s">Roxanne Capital · per ${repToday()}</div>`;
  h+=`<div class="rep-r" style="font-weight:900;border-bottom:1.5px solid var(--bdr)"><span class="rl">Akun</span><span style="display:flex;gap:10px"><span class="rv" style="width:70px;text-align:right">Debit</span><span class="rv" style="width:70px;text-align:right">Kredit</span></span></div>`;
  tb.forEach(r=>{ totD+=r.debit; totK+=r.credit;
    h+=`<div class="rep-r"><span class="rl" style="font-size:11px">${r.code} · ${r.name}</span><span style="display:flex;gap:10px">${cell(r.debit)}${cell(r.credit)}</span></div>`;});
  h+=`<div class="rep-r tot"><span class="rl">TOTAL</span><span style="display:flex;gap:10px"><span class="rv" style="width:70px;text-align:right">${fjPlain(totD)}</span><span class="rv" style="width:70px;text-align:right">${fjPlain(totK)}</span></span></div>`;
  const bal=Math.abs(totD-totK)<0.005;
  h+=`<div class="rep-ok" style="color:${bal?'#0B8F46':'var(--r)'}">${bal?'✓ Debit = Kredit':'⚠ Tidak seimbang'}</div>`;
  return h+`</div>`;
}
function repJurnal(){
  const entries=(S.ledger||[]).slice().sort((a,b)=>a.tanggal<b.tanggal?1:(a.tanggal>b.tanggal?-1:0));
  let h=`<div class="rep"><div class="rep-t">JURNAL UMUM</div><div class="rep-s">Roxanne Capital · ${entries.length} entri</div>`;
  entries.slice(0,120).forEach(e=>{
    const lines=e.lines.slice().sort((a,b)=>(b.debit>0?1:0)-(a.debit>0?1:0)); // debits first
    h+=`<div style="border-bottom:1px solid var(--bdr);padding:7px 0">
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--sub);font-weight:800"><span>${fd(e.tanggal)}</span><span>${e.ref||''}</span></div>
      <div style="font-size:11.5px;font-weight:800;margin:2px 0 3px">${e.memo}</div>`;
    lines.forEach(l=>{
      const isD=l.debit>0.005;
      h+=`<div style="display:flex;justify-content:space-between;font-size:11px;padding-left:${isD?'0':'18px'}"><span style="color:var(--sub)">${acct(l.account).name}</span><span class="t-num" style="font-weight:700">${isD?fjPlain(l.debit):fjPlain(l.credit)}</span></div>`;
    });
    h+=`</div>`;
  });
  if(entries.length>120) h+=`<div style="text-align:center;font-size:10px;color:var(--sub);margin-top:8px">120 entri terbaru dari ${entries.length}</div>`;
  return h+`</div>`;
}

// Timezone-safe date helpers (local components, NOT toISOString which shifts UTC).
function isoLocal(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayISO(){ return isoLocal(new Date()); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoLocal(d); }
function monthsBetween(a,b){ const x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00'); return Math.max(1,Math.round((y-x)/2629800000)); }
// Build forward obligation schedule: monthly bagi hasil on payDay until maturity, then pokok.
// flexible = perpetual (Papa): rolling 12 months of bagi hasil, no pokok.
function buildRealSchedule(payDay, maturity, pokok, rate, flexible){
  const bh=Math.round(pokok*rate/100*1e4)/1e4, sched=[], now=new Date();
  const clampDay=(y,m,d)=>Math.min(d, new Date(y,m+1,0).getDate());
  let y=now.getFullYear(), m=now.getMonth();
  if(now.getDate()>=payDay){ m++; } // payDay bulan ini sudah lewat → mulai bulan depan
  for(let k=0;k<(flexible?12:60);k++){
    const yy=y+Math.floor((m+k)/12), mm=((m+k)%12+12)%12;
    const t=`${yy}-${String(mm+1).padStart(2,'0')}-${String(clampDay(yy,mm,payDay)).padStart(2,'0')}`;
    if(!flexible && t>maturity) break;
    sched.push({tanggal:t, tipe:'bagihasil', jumlah:bh, status:'pending'});
  }
  if(!flexible && maturity) sched.push({tanggal:maturity, tipe:'pokok', jumlah:pokok, status:'pending'});
  return sched;
}

// ── M6: MESIN LIKUIDITAS + REKOMENDASI ────────────────────────────────
// Dua lapis: aktual (saldo kantong dari ledger) + proyeksi (jadwal kontrak
// investor = keluar, jadwal proyek = masuk). Inflow proyek = return bersih
// (gross - fee Mas Hena) + pokok (deploy) di JT. Papa = flexible, dikecualikan
// dari kewajiban likuiditas. Skenario conservative = inflow proyek digeser +7 hari.
function m6Inflows(scenario){
  const names=(S.orgConfig&&S.orgConfig.activeProjectNames)||[];
  const shift = scenario==='stress' ? 21 : (scenario==='conservative' ? 7 : 0);
  const hair  = scenario==='stress' ? 0.85 : 1; // stress: haircut return proyek 15%
  const out=[];
  (S.projects||[]).filter(p=>names.includes(p.peminjam)).forEach(p=>{
    const fee=parseFloat(p.adminFeePersen)||0.5, kontrak=parseFloat(p.kontrak||0), deploy=parseFloat(p.jumlah||0);
    (p.schedule||[]).filter(s=>s.status!=='paid'&&s.status!=='skipped').forEach(s=>{
      const net=Math.round((parseFloat(s.amount||0)-kontrak*fee/100)*hair*1e4)/1e4;
      out.push({tanggal:addDays(s.dueDate,shift), jumlah:net, label:p.peminjam+' · return', tipe:'return'});
    });
    if(p.tanggalJT) out.push({tanggal:addDays(p.tanggalJT,shift), jumlah:Math.round(deploy*hair*1e4)/1e4, label:p.peminjam+' · pokok balik', tipe:'pokok'});
  });
  return out.filter(i=>i.tanggal>=todayISO()).sort((a,b)=>a.tanggal<b.tanggal?-1:1);
}
function m6Obligations(){
  const out=[];
  invContracts().filter(c=>!c.flexible && c.status!=='selesai').forEach(c=>{
    (c.schedule||[]).filter(s=>s.status==='pending').forEach(s=>{
      out.push({tanggal:s.tanggal, jumlah:s.jumlah, tipe:s.tipe, label:c.nama+' · '+(s.tipe==='pokok'?'pokok':'bagi hasil')});
    });
  });
  return out.filter(o=>o.tanggal>=todayISO()).sort((a,b)=>a.tanggal<b.tanggal?-1:1);
}
function m6Project(scenario){
  const start=totalLikuid();
  const ev=[...m6Inflows(scenario).map(i=>({t:i.tanggal,amt:i.jumlah,...i})),
            ...m6Obligations().map(o=>({t:o.tanggal,amt:-o.jumlah,...o}))].sort((a,b)=>a.t<b.t?-1:1);
  let cash=start, minCash=start, minDate=todayISO(), firstDanger=null;
  const series=[];
  ev.forEach(e=>{ cash=Math.round((cash+e.amt)*1e4)/1e4; series.push({t:e.t,cash,label:e.label,amt:e.amt}); if(cash<minCash){minCash=cash;minDate=e.t;} if(cash<-0.005&&!firstDanger) firstDanger={t:e.t,cash}; });
  return {start,minCash,minDate,firstDanger,series};
}
function m6NearOblig(days){ return m6Obligations().filter(o=>{const d=du(o.tanggal); return d!==null&&d>=0&&d<=days;}).reduce((s,o)=>s+o.jumlah,0); }
// Reserve = celah kas TERBURUK di skenario stress (setelah memperhitungkan inflow
// proyek yang di-buffer + haircut) + cushion. Bukan "largest maturity" mentah, karena
// untuk fund yang fully-deployed, kewajiban ditutup oleh return proyek yang datang
// lebih dulu. Jadi cadangan cuma perlu menutup RESIDUAL risiko, bukan total pokok.
function m6RRPRRequired(){
  const stress=m6Project('stress');
  const peakGap=Math.max(0,-stress.minCash);
  return Math.round((peakGap*1.25 + m6Cushion())*1e4)/1e4;
}
function m6Cushion(){ return Math.round(m6NearOblig(30)*((S.orgConfig&&S.orgConfig.cushionPct||15)/100)*1e4)/1e4; }
function m6SafeProjectSize(){
  // Attack pakai kas likuid selain RRPR (RRPR = benteng). Sisakan cushion.
  const cons=m6Project('conservative');
  const rrpr=pocketBalance('1020');
  const safe=cons.minCash - rrpr - m6Cushion();
  return Math.round(Math.max(0,safe)*1e4)/1e4;
}
function m6Status(){
  const cons=m6Project('conservative'), rrpr=pocketBalance('1020'), req=m6RRPRRequired();
  if(cons.minCash < -0.005 || cons.firstDanger) return {k:'MERAH',c:'#DC2626',bg:'#FEE2E2',msg:'Ada tanggal kas jebol. Kewajiban tidak tertutup di skenario konservatif.'};
  if(cons.minCash < m6Cushion() || rrpr < req) return {k:'KUNING',c:'#B45309',bg:'#FEF3C7',msg:'Masih tertutup, tapi tipis: kas mendekati cushion atau cadangan RRPR di bawah target.'};
  return {k:'HIJAU',c:'#0B8F46',bg:'#D1FAE5',msg:'Semua kewajiban tertutup dengan aman di skenario konservatif (inflow proyek diasumsikan telat H+7).'};
}
function m6KPIs(){
  const equity=acctBalance('3000')+acctBalance('3010')+acctBalance('3900')+labaBerjalan();
  const invLiab=acctBalance('2000');
  const idleInv=pocketBalance('1030');
  // laba bulan berjalan (perkiraan): return bersih 30 hari - bagi hasil 30 hari - papa 2%
  const in30=m6Inflows('base').filter(i=>i.tipe==='return'&&du(i.tanggal)<=30).reduce((s,i)=>s+i.jumlah,0);
  const bh30=m6NearOblig(30) - m6Obligations().filter(o=>o.tipe==='pokok'&&du(o.tanggal)<=30).reduce((s,o)=>s+o.jumlah,0);
  const papa=invContracts().filter(c=>c.flexible).reduce((s,c)=>s+parseFloat(c.pokok||0)*0.02,0);
  const labaBln=Math.round((in30-bh30-papa)*1e4)/1e4;
  const cons=m6Project('conservative');
  const runway = cons.firstDanger ? du(cons.firstDanger.t) : null;
  return {
    equity:Math.round(equity*1e4)/1e4, invLiab, leverage: equity>0?Math.round(invLiab/equity*100)/100:0,
    idleInv, idleCost:Math.round(idleInv*0.02*1e4)/1e4, labaBln,
    roe: equity>0?Math.round(labaBln/equity*1000)/10:0, runway
  };
}
function m6Recommendations(){
  const recs=[];
  const sink=pocketBalance('1040');
  const nextP=m6Obligations().filter(o=>o.tipe==='pokok')[0];
  if(nextP){
    const dd=du(nextP.tanggal), need=Math.round((nextP.jumlah - sink)*1e4)/1e4;
    if(need>0.005 && dd!==null && dd<=30)
      recs.push({lv: dd<=7?'red':'yellow', t:`Pindahkan ${fj(need)} ke Investor Jatuh Tempo sebelum ${fd(nextP.tanggal)} (${dd}h lagi).`, s:`Pokok ${nextP.label.split(' · ')[0]} ${fj(nextP.jumlah)} jatuh tempo; sinking fund baru ${fj(sink)}.`});
  }
  const rrpr=pocketBalance('1020'), req=m6RRPRRequired();
  if(rrpr < req - 0.005) recs.push({lv:'yellow', t:`Top-up RRPR ${fj(req-rrpr)}.`, s:`Cadangan ${fj(rrpr)}, target ${fj(req)} (celah stress + cushion).`});
  const idle=pocketBalance('1030');
  if(idle>0.5) recs.push({lv:'yellow', t:`Deploy ${fj(idle)} dana investor yang nganggur.`, s:`Kena biaya 2%/bln (${fj(idle*0.02)}/bln) padahal belum kerja.`});
  const safe=m6SafeProjectSize();
  if(safe>0.5) recs.push({lv:'green', t:`Aman ambil proyek baru sampai ${fj(safe)} hari ini.`, s:`Di atas itu ganggu kemampuan bayar investor (skenario konservatif).`});
  else {
    const nextIn=m6Inflows('conservative').find(i=>i.tipe==='pokok');
    recs.push({lv:'green', t:`Modal hampir fully deployed, cash bebas untuk attack ~Rp 0.`, s: nextIn?`Tunggu ${nextIn.label.split(' · ')[0]} balik ~${fj(nextIn.jumlah)} (${fd(nextIn.tanggal)}) baru bisa ambil proyek baru.`:`Tunggu return proyek masuk dulu.`});
  }
  return recs;
}

  // recommendations
  h+=`<div class="rep-sec" style="color:var(--p-deep)">🎯 Rekomendasi Aksi</div>`;

    h+=`<div class="card-s" style="margin-bottom:8px;background:${bg};border-left:4px solid ${col}">

// ── M4: INBOX AUTO-POSTING (deteksi otomatis + approval) ──────────────
// Sistem deteksi transaksi jatuh tempo dari jadwal (kontrak investor + proyek),
// user tinggal Accept (default), Custom (ubah dulu), atau Skip. Jadi buku selalu
// cocok Bank Jago tanpa rekonsiliasi manual, tapi user tetap pegang kendali.
function pendingEvents(){
  const events=[], look=5; // tampilkan yang jatuh tempo dalam 5 hari atau lewat
  invContracts().filter(c=>c.status!=='selesai' && !c.flexible).forEach(c=>{ // Papa fleksibel: dikecualikan (rollable)
    (c.schedule||[]).forEach((s,i)=>{
      if(s.status!=='pending') return; const dd=du(s.tanggal); if(dd===null||dd>look) return;
      events.push({id:'inv:'+c.id+':'+i, kind:'inv', cid:c.id, idx:i, tipe:s.tipe, tanggal:s.tanggal, dd, jumlah:s.jumlah, arah:'keluar',
        judul:(s.tipe==='pokok'?'💰 Kembalikan pokok · ':'📈 Bayar bagi hasil · ')+c.nama});
    });
  });
  const names=(S.orgConfig&&S.orgConfig.activeProjectNames)||[];
  (S.projects||[]).filter(p=>names.includes(p.peminjam)).forEach(p=>{
    const fee=parseFloat(p.adminFeePersen)||0.5, kontrak=parseFloat(p.kontrak||0), deploy=parseFloat(p.jumlah||0);
    (p.schedule||[]).forEach((s,i)=>{
      if(s.status==='paid'||s.status==='skipped') return; const dd=du(s.dueDate); if(dd===null||dd>look) return;
      const gross=parseFloat(s.amount||0), feeAmt=Math.round(kontrak*fee/100*1e4)/1e4;
      events.push({id:'proj:'+p.peminjam+':'+i, kind:'proj', pname:p.peminjam, idx:i, tanggal:s.dueDate, dd, feeAmt, gross,
        jumlah:Math.round((gross-feeAmt)*1e4)/1e4, arah:'masuk', judul:'📥 Return proyek · '+p.peminjam});
    });
    if(p.tanggalJT && !p.pokokRecorded){ const ddj=du(p.tanggalJT); if(ddj!==null&&ddj<=look)
      events.push({id:'projpokok:'+p.peminjam, kind:'projpokok', pname:p.peminjam, tanggal:p.tanggalJT, dd:ddj, jumlah:deploy, arah:'masuk', judul:'📥 Pokok proyek balik · '+p.peminjam}); }
  });
  const skip=window._inboxSkip||{};
  return events.filter(e=>!skip[e.id]).sort((a,b)=>a.tanggal<b.tanggal?-1:1);
}
function inboxPost(ev, pocket, date, amount){
  amount=(amount!=null)?amount:ev.jumlah;
  if(ev.kind==='inv'){
    const c=invContracts().find(x=>x.id===ev.cid); if(!c) return; const s=c.schedule[ev.idx];
    if(ev.tipe==='pokok') txKembalikanPokokInvestor(date,amount,pocket,'Kembalikan pokok: '+c.nama);
    else ledgerPost(date,'Bagi hasil: '+c.nama,[{account:'5000',debit:amount,credit:0},{account:pocket,debit:0,credit:amount}],'bayar-bh');
    s.status='paid'; s.paidDate=date; s.paidFrom=pocket;
    if(!(c.schedule||[]).some(x=>x.status==='pending')) c.status='selesai';
  } else if(ev.kind==='proj'){
    const p=(S.projects||[]).find(x=>x.peminjam===ev.pname); if(!p) return; const s=p.schedule[ev.idx];
    ledgerPost(date,'Return proyek: '+p.peminjam,[{account:pocket,debit:amount,credit:0},{account:'5020',debit:ev.feeAmt,credit:0},{account:'4000',debit:0,credit:Math.round((amount+ev.feeAmt)*1e4)/1e4}],'return');
    if(s){ s.status='paid'; s.paidDate=date; }
  } else if(ev.kind==='projpokok'){
    const p=(S.projects||[]).find(x=>x.peminjam===ev.pname); if(!p) return;
    txPokokProyekBalik(date,amount,pocket,'Pokok balik: '+p.peminjam); p.pokokRecorded=true;
  }
  save(); rKeu();
}
function inboxAccept(id){ const ev=pendingEvents().find(e=>e.id===id); if(!ev) return; inboxPost(ev, ev.arah==='keluar'?'1040':'1000', todayISO(), ev.jumlah); toast('✅ Dicatat'); }
function inboxSkip(id){ window._inboxSkip=window._inboxSkip||{}; window._inboxSkip[id]=1; rKeu(); toast('Dilewati (muncul lagi nanti)'); }
function inboxCustom(id){
  const ev=pendingEvents().find(e=>e.id===id); if(!ev) return;
  document.getElementById('mo-keu-t').textContent='✏️ Custom';

    <div class="fc-note" style="margin-bottom:12px">${ev.judul} · jatuh tempo ${fd(ev.tanggal)}</div>

    <div class="fg"><label class="fl">${ev.arah==='keluar'?'Bayar dari kantong':'Masuk ke kantong'}</label><select class="fi" id="ib-pocket">${pocketOptions(ev.arah==='keluar'?'1040':'1000')}</select></div>
    <div class="fg"><label class="fl">Tanggal aktual</label><input class="fi" id="ib-date" type="date" value="${todayISO()}"></div>
    <button class="btn pr fw" onclick="inboxConfirm('${id}')" style="margin-top:8px">Catat</button>`;

}
function inboxConfirm(id){
  const ev=pendingEvents().find(e=>e.id===id); if(!ev) return;
  const amt=parseFloat(document.getElementById('ib-amt').value||0), pocket=document.getElementById('ib-pocket').value, date=document.getElementById('ib-date').value;
  if(!(amt>0)){ toast('❌ Jumlah harus > 0'); return; }
  inboxPost(ev, pocket, date, amt); cm('mo-keu'); toast('✅ Dicatat (custom)');
}
function rKeuInbox(){
  const ev=pendingEvents();
  let h=`<div class="fc-note" style="margin-bottom:12px">Transaksi terdeteksi otomatis dari jadwal. <b>Accept</b> = catat default · <b>Custom</b> = ubah jumlah/kantong/tanggal · <b>Skip</b> = sembunyikan sementara.</div>`;
  if(!ev.length) return h+`<div class="es"><div class="ei">✅</div><div class="et">Inbox bersih</div><div class="esb">Tidak ada transaksi jatuh tempo dalam 5 hari ke depan.</div></div>`;
  ev.forEach(e=>{

      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="min-width:0"><div style="font-size:13px;font-weight:900">${e.judul}</div>
          <div style="font-size:10px;font-weight:800;color:${col}">${fd(e.tanggal)} · ${gl(e.dd)}</div></div>
        <div class="t-num" style="font-size:15px;font-weight:900;color:${e.arah==='masuk'?'#0B8F46':'var(--r)'};white-space:nowrap">${e.arah==='masuk'?'+':'−'}${fj(e.jumlah)}</div>
      </div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn pr" onclick="inboxAccept('${e.id}')" style="flex:1;font-size:11px;padding:8px 4px">✅ Accept</button>
        <button class="btn ou" onclick="inboxCustom('${e.id}')" style="flex:1;font-size:11px;padding:8px 4px">✏️ Custom</button>
        <button class="btn ou" onclick="inboxSkip('${e.id}')" style="font-size:11px;padding:8px 10px;color:var(--sub)">Skip</button>
      </div>
    </div>`;
  });
  return h;

function am(s,m){

// Calculate investor's total return based on UMUM rate for their allocated amount
function calcInvestorReturn(project, allocAmount){
  const rt=project.returnType||'sekali';
  const amt=parseFloat(allocAmount||0);
  const base=publicKontrakP(project);
  if(rt==='bulanan'){
    const dur=activeDur(project);

      umumPerMonth=base*parseFloat(project.returnPersenUmum||0)/100;
    } else {
      umumPerMonth=parseFloat(project.returnBulananUmum||0);
    }
    return parseFloat((umumPerMonth * (amt/base) * dur).toFixed(2));
  }
  const totalUmumProfit=profUmum(project);
  return parseFloat((totalUmumProfit * (amt/base)).toFixed(2));

// Calculate owner's net profit: gross return − admin fee − NON-owner investor shares.
// Owners are the residual recipients, so their allocations are NOT subtracted.
function calcAdminNetProfit(project){
  const totalAdminProfit=profP(project);
  const invs=S.external.filter(e=>e.tipe==='investor'&&!e.isOwner&&(e.alokasi||[]).some(a=>a.pid===project.id));
  let totalInvShare=0;
  invs.forEach(e=>{
    const a=e.alokasi.find(x=>x.pid===project.id)||{};
    totalInvShare+=calcInvestorReturn(project, a.jumlah||0);
  });
  const fee=adminFeeTotal(project);
  return parseFloat((totalAdminProfit - totalInvShare - fee).toFixed(2));
}

// Generate monthly payment schedule for a project
function generateSchedule(project){
  if(!project.tanggalMulai || !project.durasiReturn) return;
  const dur=parseInt(project.durasiReturn||0);
  if(dur<=0) return;
  const rt=project.returnType||'sekali';
  if(rt!=='bulanan') return;
  // Check if schedule exists and matches duration + amount
  const existing=project.schedule||[];
  const monthlyAmt0=retBulananRp(project);
  const amtMatch=existing.length>0&&Math.abs(parseFloat(existing[0].amount||0)-monthlyAmt0)<0.001;
  // Also regenerate if any unpaid dueDate doesn't match expected (tanggalMulai changed)
  const dateMatch=existing.every((s,idx)=>s.status==='paid'||s.dueDate===am(project.tanggalMulai,idx+1));
  // Also regenerate if skipped items need updating (tanggalAktif changed or newly added)
  const aktifDate=project.tanggalAktif||null;
  const needsSkipUpdate=aktifDate&&existing.some(s=>s.status!=='paid'&&s.status!=='skipped'&&s.dueDate<=aktifDate);
  if(existing.length===dur&&amtMatch&&dateMatch&&!needsSkipUpdate) return;
  // Build new schedule, preserving paid statuses from existing
  const monthlyAmt=monthlyAmt0;
  const newSched=[];
  for(let i=0;i<dur;i++){
    const dueDate=am(project.tanggalMulai, i+1);
    const old=existing[i]||null;
    // Skip periods before project was taken (tanggalAktif)
    const isBeforeEntry=aktifDate && dueDate<=aktifDate;
    let st='pending';
    if(old&&old.status==='paid') st='paid';
    else if(old&&old.status==='skipped') st='skipped';
    else if(isBeforeEntry) st='skipped';
    newSched.push({
      month: i+1,
      dueDate: dueDate,
      status: st,
      paidDate: st==='paid'?(old?.paidDate||null):null,
      amount: monthlyAmt,
      isFinal: i===dur-1
    });
  }
  project.schedule=newSched;
}

// Get the next unpaid schedule item (or null if all paid)
function getNextDue(project){
  const rt=project.returnType||'sekali';
  if(rt==='bulanan'){
    generateSchedule(project);
    const sched=project.schedule||[];
    return sched.find(s=>s.status!=='paid'&&s.status!=='skipped')||null;
  }
  // sekali: single payment at tanggalJT
  const paid=(project.payments||[]).length>0;
  if(paid) return null;
  return {month:1, dueDate:project.tanggalJT, status:'pending', paidDate:null, amount:kontrakP(project), isFinal:true};
}

// ── MODAL SCROLL-LOCK ─────────────────────────────────────────────────
// The document scrolls natively (no overflow:hidden shell, no inner .page
// scrollers). While ANY modal is open we freeze the document by fixing <body>
// at its current scroll offset, then restore that exact offset on close.
// Reference-guarded + idempotent, so close-then-open and double-close modal
// chains net to the correct locked/unlocked state with no scroll jump.
// This replaces the old pointer-events juggling + healViewport + 2s watchdog,
// all of which fought the browser and were the source of the recurring freeze.
let _scrollLocked=false,_scrollLockY=0;
function lockScroll(){
  if(_scrollLocked) return;
  _scrollLockY=window.scrollY||window.pageYOffset||0;
  document.body.style.top=(-_scrollLockY)+'px';
  document.body.classList.add('modal-open');
  _scrollLocked=true;
}
function unlockScroll(){
  if(!_scrollLocked) return;
  _scrollLocked=false;
  document.body.classList.remove('modal-open');
  document.body.style.top='';
  window.scrollTo(0,_scrollLockY);
}
// Single source of truth: the document is locked iff any modal is open.
function syncModalState(){
  if(document.querySelector('.mo.op')) lockScroll();
  else unlockScroll();
}
// iOS momentum-scroll release for the ONLY remaining inner scroller (the .modal
// body, overflow-y:auto). Replacing an overflow:auto container's content mid-
// momentum can freeze its touch scrolling until a reflow; a double-rAF overflowY
// toggle releases it. Called from om() so EVERY modal open/reopen is covered —
// no per-path discipline to forget (that discipline was the old bug's root cause).
function releaseScroller(el){
  if(!el) return;
  requestAnimationFrame(()=>{
    const prev=el.style.overflowY;
    el.style.overflowY='hidden';
    void el.offsetHeight; // force reflow
    requestAnimationFrame(()=>{ el.style.overflowY=prev||''; });
  });
}
function om(id){
  const el=document.getElementById(id); if(!el) return;
  el.classList.add('op');
  lockScroll();
  releaseScroller(el.querySelector('.modal'));
}
function cm(id){
  // Blur any focused input before hiding, so the iOS keyboard collapses cleanly.
  const ae=document.activeElement;
  if(ae&&ae.blur&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT')) ae.blur();
  const el=document.getElementById(id); if(el) el.classList.remove('op');
  syncModalState();
}

// Split total projected return into realized (cair) vs scheduled (terjadwal).
// The two ALWAYS sum to the full projected return — so the bar is always full
// and the remainder reads as "upcoming/scheduled", never "failed".
function returnSplit(list){
  let proj=0,realized=0;
  list.forEach(p=>{
    const pr=_adminUnlocked?profP(p):profUmum(p);
    proj+=pr;
    const rt=p.returnType||'sekali';
    let frac=0;
    if(rt==='bulanan'&&p.schedule&&p.schedule.length){
      const active=p.schedule.filter(s=>s.status!=='skipped').length;
      const paid=p.schedule.filter(s=>s.status==='paid').length;
      frac=active>0?paid/active:0;
    } else {
      frac=(p.payments&&p.payments.length>0)?1:0;
    }
    realized+=pr*frac;
  });
  realized=parseFloat(realized.toFixed(2));
  proj=parseFloat(proj.toFixed(2));
  return {proj,realized,scheduled:Math.max(0,parseFloat((proj-realized).toFixed(2)))};
}

let _kalMonth=null,_kalYear=null;
function getCalendarEvents(year,month){
  // Returns map: YYYY-MM-DD → [{type, label, amount, color}]
  const events={};
  const monthStart=new Date(Date.UTC(year,month,1));
  const monthEnd=new Date(Date.UTC(year,month+1,0));
  const inMonth=(s)=>{
    if(!s) return false;
    const d=new Date(s+'T00:00:00Z');
    return d>=monthStart && d<=monthEnd;
  };
  // 1. Income: payment schedule items (paid + pending) from active projects
  S.projects.forEach(p=>{
    const rt=p.returnType||'sekali';
    if(rt==='bulanan'&&p.schedule){
      p.schedule.forEach(s=>{
        if(s.status==='skipped') return;
        if(!inMonth(s.dueDate)) return;
        events[s.dueDate]=events[s.dueDate]||[];
        events[s.dueDate].push({
          type:'income',
          label:p.peminjam,
          amount:parseFloat(s.paidAmount||s.amount||0),
          paid:s.status==='paid',
          pid:p.id,
          isFinal:s.isFinal,
        });
      });
    } else {
      // sekali: single event at tanggalJT
      if(inMonth(p.tanggalJT)&&(p.status==='aktif'||p.status==='terlambat')){
        events[p.tanggalJT]=events[p.tanggalJT]||[];
        events[p.tanggalJT].push({
          type:'income',
          label:p.peminjam,
          amount:kontrakP(p),
          paid:(p.payments||[]).length>0,
          pid:p.id,
        });
      }
    }
  });
  // 2. Utang: pinjaman jadwalBayar — varies by tipePinjaman
  S.external.filter(e=>e.tipe==='pinjaman'&&e.status!=='selesai').forEach(e=>{
    if(!e.jadwalBayar) return;
    const tp=e.tipePinjaman||'angsuran';
    const j=parseFloat(e.jumlah||0);
    const bungaBln=j*parseFloat(e.bungaPct||0)/100;
    if(tp==='jatuh_tempo'){
      if(!inMonth(e.jadwalBayar)) return;
      const totalBunga=bungaBln*(e.durasi||0);
      events[e.jadwalBayar]=events[e.jadwalBayar]||[];
      events[e.jadwalBayar].push({type:'utang',label:e.nama+' (pokok+bunga)',amount:j+totalBunga});
    } else if(tp==='bunga_saja'){
      if(inMonth(e.jadwalBayar)){
        events[e.jadwalBayar]=events[e.jadwalBayar]||[];
        events[e.jadwalBayar].push({type:'utang',label:e.nama+' (bunga)',amount:bungaBln});
      }
    } else {
      if(!inMonth(e.jadwalBayar)) return;
      events[e.jadwalBayar]=events[e.jadwalBayar]||[];
      events[e.jadwalBayar].push({type:'utang',label:e.nama,amount:parseFloat(e.cicilanBulan||0)});
    }
  });
  // 3. Bagi hasil ke investor non-owner: per paid schedule item, compute investor share
  S.projects.forEach(p=>{
    const rt=p.returnType||'sekali';
    if(rt!=='bulanan'||!p.schedule) return;
    const nonOwnerInvs=S.external.filter(e=>e.tipe==='investor'&&!e.isOwner&&(e.alokasi||[]).some(a=>a.pid===p.id));
    if(nonOwnerInvs.length===0) return;
    p.schedule.forEach(s=>{
      if(s.status==='skipped') return;
      if(!inMonth(s.dueDate)) return;
      const monthlyGross=parseFloat(s.amount||0);
      nonOwnerInvs.forEach(inv=>{
        const a=inv.alokasi.find(x=>x.pid===p.id);
        if(!a) return;
        const base=publicKontrakP(p);
        if(base<=0) return;
        const share=monthlyGross*(parseFloat(a.jumlah||0)/base);
        if(share<=0) return;
        events[s.dueDate]=events[s.dueDate]||[];
        events[s.dueDate].push({
          type:'bagihasil',
          label:`${inv.nama} (${p.peminjam})`,
          amount:share,
        });
      });
    });
  });
  // 4. Admin fee (marketing) — per schedule month, for projects with fee > 0
  S.projects.forEach(p=>{
    if(adminFeePersen(p)<=0) return;
    const rt=p.returnType||'sekali';
    if(rt!=='bulanan'||!p.schedule) return;
    const monthlyFee=adminFeeMonthly(p);
    if(monthlyFee<=0) return;
    p.schedule.forEach(s=>{
      if(s.status==='skipped') return;
      if(!inMonth(s.dueDate)) return;
      events[s.dueDate]=events[s.dueDate]||[];
      events[s.dueDate].push({
        type:'adminfee',
        label:`${adminFeeRecipient(p)} (${p.peminjam})`,
        amount:monthlyFee,
      });
    });
  });
  return events;
}
function rK(){
  const el=document.getElementById('p-k');if(!el)return;
  const now=new Date();
  if(_kalYear===null){_kalYear=now.getFullYear();_kalMonth=now.getMonth();}
  const year=_kalYear,month=_kalMonth;
  const events=getCalendarEvents(year,month);
  // Compute totals
  let totalIncome=0,totalUtang=0,totalBagiHasil=0,totalAdminFee=0;
  Object.values(events).flat().forEach(e=>{
    if(e.type==='income') totalIncome+=e.amount;
    else if(e.type==='utang') totalUtang+=e.amount;
    else if(e.type==='bagihasil') totalBagiHasil+=e.amount;

// Compute owner's modal breakdown
function getOwnerModal(ownerId){
  const owner=S.external.find(e=>e.id===ownerId);
  if(!owner) return {cash:0,utang:0,total:0,deployed:0,idle:0,utangSources:[]};
  const cash=parseFloat(owner.jumlah||0);
  // Sum utang assigned to this owner
  const pinjamen=S.external.filter(e=>e.tipe==='pinjaman'&&e.status!=='selesai');
  const utangSources=[];
  let utang=0;
  pinjamen.forEach(p=>{
    const assignment=(p.assignedOwners||[]).find(a=>a.ownerId===ownerId);
    if(assignment){
      utang+=parseFloat(assignment.jumlah||0);
      utangSources.push({nama:p.nama,jumlah:parseFloat(assignment.jumlah||0)});
    }
  });
  const total=cash+utang;
  const deployed=(owner.alokasi||[]).reduce((s,a)=>s+parseFloat(a.jumlah||0),0);
  const idle=total-deployed;
  return {cash,utang,total,deployed,idle,utangSources};
}

function getProfitEntries(){
  const entries=[];
  S.projects.forEach(p=>{
    if((p.returnType||'sekali')==='bulanan'&&p.schedule){
      p.schedule.filter(si=>si.status==='paid').forEach(si=>{
        const d=si.paidDate||'';
        const amt=parseFloat(si.paidAmount||si.amount||0);
        if(amt>0&&d) entries.push({tanggal:d,jumlah:amt,label:p.peminjam});
      });
    } else {
      (p.payments||[]).forEach(py=>{
        const amt=parseFloat(py.jumlah||0);
        if(amt>0&&py.tanggal) entries.push({tanggal:py.tanggal,jumlah:amt,label:p.peminjam});
      });
    }
  });
  return entries;
}
