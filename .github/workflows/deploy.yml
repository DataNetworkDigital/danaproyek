name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deploy folder
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp treasury.js _site/treasury.js
          cp laporan.html _site/laporan.html
          # Pin the engine URL to this commit so a cached treasury.js can never
          # mismatch a fresh index.html (would break the Treasury hub).
          sed -i "s|treasury.js\"|treasury.js?v=${GITHUB_SHA}\"|g" _site/index.html _site/laporan.html
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
